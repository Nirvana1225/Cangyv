<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>苍聿居 · 桌宠小游戏</title>
<link rel="manifest" href="/manifest.json">
<style id="global-css"></style>
<style>
.pet-page { max-width: 800px; margin: 0 auto; padding: 12px; }

/* ── 场景 ── */
.pet-scene {
    position: relative; width: 100%; height: 300px;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    border-radius: var(--radius-lg); border: 1px solid var(--border);
    overflow: hidden; margin-bottom: 12px; user-select: none;
    -webkit-user-select: none;
}
.pet-scene.night { background: linear-gradient(180deg, #0a0a1a 0%, #0d1525 60%, #091a30 100%); }
.pet-scene .ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(180deg, #2a2a4a, #1e1e3a);
    border-top: 2px solid rgba(124,108,240,0.2);
}
.pet-scene .stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.pet-scene .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%; animation: twinkle 3s infinite;
}
@keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:1} }

/* 宠物容器 */
.pet-canvas-wrap {
    position: absolute; bottom: 60px; cursor: pointer;
    transition: left 0.8s ease-in-out; image-rendering: pixelated;
    z-index: 2;
}
.pet-canvas-wrap canvas { display: block; image-rendering: pixelated; }
.pet-name-tag {
    text-align: center; font-size: 0.65rem; color: rgba(255,255,255,0.7);
    margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-weight: 600;
}

/* 饥饿提示 */
.hungry-alert {
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; color: #f39c12; font-weight: 700;
    animation: shake 0.4s infinite; pointer-events: none; white-space: nowrap;
}
@keyframes shake { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 3px))} 75%{transform:translateX(calc(-50% + 3px))} }

/* ── 掉落食物 ── */
.falling-item {
    position: absolute; font-size: 1.4rem; z-index: 3;
    pointer-events: none; transition: none;
    animation: fall linear forwards;
}
@keyframes fall { 0%{transform:translateY(0)} 100%{transform:translateY(var(--fall-dist))} }

/* ── 得分/连击 ── */
.game-hud {
    position: absolute; top: 8px; right: 10px; z-index: 5;
    text-align: right; pointer-events: none;
}
.game-hud .score { font-size: 1rem; font-weight: 700; color: #f39c12; text-shadow: 0 0 6px rgba(243,156,18,0.4); }
.game-hud .combo { font-size: 0.8rem; color: #e91e63; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
.game-hud .combo.show { opacity: 1; }

/* 快速点击倒计时 */
.click-timer {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 2rem; font-weight: 900; color: #fff; z-index: 10;
    text-shadow: 0 0 20px rgba(124,108,240,0.8);
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.click-timer.show { opacity: 1; }

/* 点击涟漪 */
.click-ripple {
    position: absolute; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(124,108,240,0.6); pointer-events: none; z-index: 4;
    animation: ripple 0.6s ease-out forwards;
}
@keyframes ripple { 0%{transform:scale(0);opacity:1} 100%{transform:scale(2);opacity:0} }

/* 浮动数字 */
.float-num {
    position: absolute; font-size: 0.8rem; font-weight: 700;
    pointer-events: none; z-index: 4;
    animation: floatUp 0.8s ease-out forwards;
}
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-30px)} }

/* ── 游戏入口面板 ── */
.game-entry-panel {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 12px;
}
.game-entry {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 6px; border-radius: var(--radius-lg);
    background: var(--card); border: 1px solid var(--border);
    cursor: pointer; transition: all .2s; text-align: center;
}
.game-entry:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); border-color: var(--accent); }
.game-entry:active { transform: scale(0.96); }
.game-entry .game-icon { font-size: 1.6rem; }
.game-entry .game-name { font-size: 0.7rem; font-weight: 600; color: var(--text); }
.game-entry .game-desc { font-size: 0.55rem; color: var(--muted); line-height: 1.3; }

/* ── 宠物面板 ── */
.pet-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pet-panel {
    background: var(--card); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px;
}
.pet-panel-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.pet-panel-header .pet-icon { font-size: 1.2rem; }
.pet-panel-header h3 { font-size: 0.9rem; flex: 1; }
.badge { font-size: 0.55rem; padding: 1px 5px; border-radius: 6px; font-weight: 600; }
.badge.ai-action { background: rgba(124,108,240,0.2); color: #7c6cf0; }
.badge.user-action { background: rgba(76,175,80,0.2); color: #4CAF50; }
.badge.ai-care { background: rgba(233,30,99,0.15); color: #e91e63; }
.badge.user-care { background: rgba(243,156,18,0.2); color: #f39c12; }

/* 状态条 */
.stat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 0.75rem; }
.stat-row .stat-icon { width: 18px; text-align: center; }
.stat-row .stat-label { width: 30px; color: var(--muted); font-size: 0.7rem; }
.stat-bar { flex: 1; height: 6px; background: rgba(0,0,0,0.2); border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.stat-bar-fill.hunger { background: linear-gradient(90deg, #e74c3c, #f39c12); }
.stat-bar-fill.mood { background: linear-gradient(90deg, #9b59b6, #e91e63); }
.stat-bar-fill.energy { background: linear-gradient(90deg, #3498db, #2ecc71); }
.stat-bar-fill.affection { background: linear-gradient(90deg, #e91e63, #ff6b9d); }
.stat-row .stat-val { width: 26px; text-align: right; color: var(--muted); font-size: 0.65rem; }

/* 动作按钮 */
.action-section { margin-top: 8px; }
.action-section .section-label {
    font-size: 0.65rem; color: var(--muted); margin-bottom: 4px;
    display: flex; align-items: center; gap: 4px;
}
.pet-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.btn-act {
    padding: 4px 8px; border-radius: var(--radius); font-size: 0.7rem; font-weight: 500;
    transition: all .2s; cursor: pointer; border: 1px solid var(--border);
    background: var(--accentLight); color: var(--accent);
}
.btn-act:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
.btn-act:active { transform: scale(0.95); }
.btn-act:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.btn-act.danger { border-color: rgba(231,76,60,0.3); color: #e74c3c; background: rgba(231,76,60,0.1); }
.btn-act.danger:hover { background: #e74c3c; color: #fff; }

/* 状态标签 */
.state-tag {
    display: inline-block; padding: 1px 6px; border-radius: 6px;
    font-size: 0.6rem; font-weight: 600; margin-left: auto;
}
.state-tag.idle { background: rgba(52,152,219,0.2); color: #3498db; }
.state-tag.sleep { background: rgba(155,89,182,0.2); color: #9b59b6; }
.state-tag.happy { background: rgba(46,204,113,0.2); color: #2ecc71; }
.state-tag.scratch { background: rgba(231,76,60,0.2); color: #e74c3c; }
.state-tag.eat { background: rgba(243,156,18,0.2); color: #f39c12; }
.state-tag.tilt { background: rgba(52,152,219,0.2); color: #5dade2; }
.state-tag.paw { background: rgba(46,204,113,0.2); color: #27ae60; }
.state-tag.bite { background: rgba(192,57,43,0.2); color: #c0392b; }

/* 日志 */
.pet-log {
    margin-top: 6px; max-height: 60px; overflow-y: auto;
    font-size: 0.6rem; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 4px;
}
.pet-log .log-entry { padding: 1px 0; opacity: 0.8; }

/* ── 说明书模态框 ── */
.guide-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    z-index: 3000; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.guide-modal.show { opacity: 1; pointer-events: auto; }
.guide-content {
    background: var(--cardSolid); border-radius: var(--radius-lg);
    padding: 20px; width: 90%; max-width: 480px; max-height: 80vh;
    overflow-y: auto; transform: scale(0.95); transition: transform 0.3s;
}
.guide-modal.show .guide-content { transform: scale(1); }
.guide-content h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
.guide-content .guide-section { margin-bottom: 14px; }
.guide-content .guide-section h3 { font-size: 0.85rem; color: var(--accent); margin-bottom: 6px; }
.guide-content .guide-section p { font-size: 0.75rem; line-height: 1.6; color: var(--text); }
.guide-content .pet-voice {
    background: var(--accentLight); border-radius: var(--radius);
    padding: 10px 14px; font-size: 0.75rem; line-height: 1.6;
    color: var(--accent); font-style: italic; margin-bottom: 8px;
}
.guide-close {
    display: block; margin: 12px auto 0; padding: 8px 24px;
    border-radius: var(--radius); background: var(--accent); color: #fff;
    font-size: 0.85rem; cursor: pointer; border: none;
}

/* ── 猜拳小游戏 ── */
.rps-result {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 1.2rem; font-weight: 700; color: #fff; z-index: 10;
    text-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
}
.rps-result.show { opacity: 1; }

/* ── 记忆翻牌 ── */
.memory-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); z-index: 8;
}
.memory-card {
    width: 48px; height: 48px; border-radius: 6px;
    background: rgba(124,108,240,0.3); border: 2px solid rgba(124,108,240,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; cursor: pointer; transition: all .3s;
}
.memory-card.flipped { background: rgba(255,255,255,0.9); border-color: var(--accent); }
.memory-card.matched { background: rgba(46,204,113,0.3); border-color: #2ecc71; opacity: 0.6; pointer-events: none; }

/* 同步状态指示器 */
.sync-indicator {
    position: fixed; bottom: 12px; right: 12px; z-index: 999;
    font-size: 0.6rem; color: var(--muted); display: flex; align-items: center; gap: 4px;
}
.sync-indicator .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #2ecc71; }
.sync-indicator .sync-dot.syncing { background: #f39c12; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

@media (max-width: 768px) {
    .pet-panels { grid-template-columns: 1fr; }
    .pet-scene { height: 240px; }
    .pet-page { padding: 8px; }
    .game-entry-panel { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .game-entry { padding: 8px 4px; }
    .game-entry .game-icon { font-size: 1.3rem; }
    .game-entry .game-name { font-size: 0.6rem; }
    .game-entry .game-desc { display: none; }
    .memory-card { width: 38px; height: 38px; font-size: 1rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/common.js"></script>
<script src="/pet.js"></script>

initTheme();

// 🎯 接食物小游戏
// ═══════════════════════════════════════
let catchGameActive = false;
let catchGameScore = 0;
let catchCombo = 0;
let catchGameTimer = null;
let totalGameScore = parseInt(localStorage.getItem('cangyv_game_score') || '0');

const FOOD_ITEMS = ['🍖', '🐟', '🥩', '🧀', '🍗', '🎾', '🧸', '🦴'];
const FOOD_VALUES = { '🍖': 8, '🐟': 6, '🥩': 7, '🧀': 5, '🍗': 8, '🎾': 4, '🧸': 3, '🦴': 6 };

function startCatchGame() {
    if (catchGameActive) return;
    catchGameActive = true;
    catchGameScore = 0;
    catchCombo = 0;
    updateGameHUD();
    addLog('cat-log', '🐱 🎯 接食物游戏开始！');
    addLog('dog-log', '🕶️ 🎯 接食物游戏开始！');
    let timeLeft = 15;
    showToast('接食物！15秒内让宠物接住掉落的食物！', 'success');
    catchGameTimer = setInterval(() => { timeLeft--; if (timeLeft <= 0) endCatchGame(); }, 1000);
    spawnFoodLoop();
}

function spawnFoodLoop() {
    if (!catchGameActive) return;
    spawnFallingItem();
    setTimeout(spawnFoodLoop, 800 + Math.random() * 1200);
}

function spawnFallingItem() {
    if (!catchGameActive) return;
    const sceneRect = scene.getBoundingClientRect();
    const food = FOOD_ITEMS[Math.floor(Math.random() * FOOD_ITEMS.length)];
    const el = document.createElement('div');
    el.className = 'falling-item';
    el.textContent = food;
    el.dataset.food = food;
    el.dataset.value = FOOD_VALUES[food] || 5;
    el.style.left = (10 + Math.random() * 80) + '%';
    el.style.top = '0px';
    el.style.setProperty('--fall-dist', (sceneRect.height - 80) + 'px');
    el.style.animationDuration = (2 + Math.random()) + 's';
    scene.appendChild(el);

    const checkCatch = setInterval(() => {
        if (!catchGameActive || !el.parentNode) { clearInterval(checkCatch); return; }
        const foodRect = el.getBoundingClientRect();
        const catRect = document.getElementById('cat-wrap').getBoundingClientRect();
        const dogRect = document.getElementById('dog-wrap').getBoundingClientRect();
        if (isOverlapping(foodRect, catRect)) { caughtBy('cat', el); clearInterval(checkCatch); }
        else if (isOverlapping(foodRect, dogRect)) { caughtBy('dog', el); clearInterval(checkCatch); }
    }, 100);

    el.addEventListener('animationend', () => { if (el.parentNode) { catchCombo = 0; updateGameHUD(); el.remove(); } });
}

function isOverlapping(a, b) {
    const m = 15;
    return !(a.right < b.left - m || a.left > b.right + m || a.bottom < b.top - m || a.top > b.bottom + m);
}

function caughtBy(petType, el) {
    const pet = petType === 'cat' ? cat : dog;
    const val = parseInt(el.dataset.value) || 5;
    catchCombo++;
    const bonus = Math.floor(val * (1 + catchCombo * 0.1));
    catchGameScore += bonus;
    totalGameScore += bonus;
    localStorage.setItem('cangyv_game_score', totalGameScore);
    pet.hunger = Math.min(100, pet.hunger + val * 0.5);
    pet.mood = Math.min(100, pet.mood + val * 0.3);
    pet.doAction('eat');
    addAffection(petType, 1);
    const rect = el.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();
    spawnFloatNum(rect.left - sceneRect.left, rect.top - sceneRect.top, `+${bonus} 🎯`, '#f39c12');
    updateGameHUD();
    el.remove();
}

function endCatchGame() {
    catchGameActive = false;
    if (catchGameTimer) clearInterval(catchGameTimer);
    scene.querySelectorAll('.falling-item').forEach(el => el.remove());
    updateGameHUD();
    const msg = `游戏结束！得分 ${catchGameScore}`;
    addLog('cat-log', '🐱 ' + msg);
    addLog('dog-log', '🕶️ ' + msg);
    showToast(msg, 'success');
}

// ✊ 猜拳小游戏（三局两胜）
// ═══════════════════════════════════════
let rpsActive = false;
let rpsWins = 0;
let rpsLosses = 0;
let rpsRound = 0;

function startRPS() {
    if (rpsActive) return;
    rpsActive = true;
    rpsWins = 0;
    rpsLosses = 0;
    rpsRound = 0;
    addLog('cat-log', '🐱 ✊ 猜拳开始！三局两胜！');
    addLog('dog-log', '🕶️ ✊ 来比比谁厉害！');
    showToast('猜拳！三局两胜，选择石头剪刀布！', 'success');
    nextRPSRound();
}

function nextRPSRound() {
    rpsRound++;
    // 显示选择按钮
    const resultEl = document.getElementById('rps-result');
    resultEl.textContent = `第${rpsRound}局 ✊✌️✋？`;
    resultEl.classList.add('show');

    // 创建选择按钮
    const choices = document.createElement('div');
    choices.id = 'rps-choices';
    choices.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;display:flex;gap:12px;';
    ['✊ 石头', '✌️ 剪刀', '✋ 布'].forEach((label, i) => {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.style.cssText = 'padding:10px 16px;border-radius:12px;font-size:1rem;cursor:pointer;border:2px solid rgba(124,108,240,0.5);background:rgba(255,255,255,0.9);color:#333;';
        btn.onclick = () => playRPS(i);
        choices.appendChild(btn);
    });
    scene.appendChild(choices);
}

function playRPS(playerChoice) {
    const choicesEl = document.getElementById('rps-choices');
    if (choicesEl) choicesEl.remove();

    const petChoice = Math.floor(Math.random() * 3);
    const names = ['✊ 石头', '✌️ 剪刀', '✋ 布'];
    const resultEl = document.getElementById('rps-result');

    let result;
    if (playerChoice === petChoice) {
        result = 'draw';
        resultEl.textContent = `你:${names[playerChoice]} 宠物:${names[petChoice]} → 平局！`;
    } else if ((playerChoice + 1) % 3 === petChoice) {
        result = 'win';
        rpsWins++;
        resultEl.textContent = `你:${names[playerChoice]} 宠物:${names[petChoice]} → 你赢了！`;
        cat.mood = Math.min(100, cat.mood + 5);
        dog.mood = Math.min(100, dog.mood + 5);
        addAffection('cat', 2); addAffection('dog', 2);
        cat.doAction('happy'); dog.doAction('happy');
    } else {
        result = 'lose';
        rpsLosses++;
        resultEl.textContent = `你:${names[playerChoice]} 宠物:${names[petChoice]} → 你输了！`;
        const angryPet = Math.random() < 0.5 ? cat : dog;
        angryPet.doAction('bite');
        addLog(angryPet.type === 'cat' ? 'cat-log' : 'dog-log',
            `${angryPet.type === 'cat' ? '🐱' : '🕶️'} 哼！我赢了！`);
    }

    totalGameScore += result === 'win' ? 10 : (result === 'lose' ? 2 : 5);
    localStorage.setItem('cangyv_game_score', totalGameScore);
    updateGameHUD();

    setTimeout(() => {
        resultEl.classList.remove('show');
        if (rpsWins >= 2 || rpsLosses >= 2) {
            endRPS();
        } else {
            nextRPSRound();
        }
    }, 1500);
}

function endRPS() {
    rpsActive = false;
    const won = rpsWins >= 2;
    const msg = won ? `✊ 猜拳胜利！${rpsWins}:${rpsLosses}` : `✊ 猜拳失败！${rpsWins}:${rpsLosses}`;
    addLog('cat-log', '🐱 ' + msg);
    addLog('dog-log', '🕶️ ' + msg);
    showToast(msg, won ? 'success' : 'info');
    if (won) {
        cat.mood = Math.min(100, cat.mood + 10);
        dog.mood = Math.min(100, dog.mood + 10);
    }
}

// ═══════════════════════════════════════
// 🃏 翻牌配对小游戏
// ═══════════════════════════════════════
let memoryActive = false;
let memoryCards = [];
let memoryFlipped = [];
let memoryMatched = 0;
let memoryMoves = 0;

const MEMORY_EMOJIS = ['🐱', '🐶', '🐟', '🍖', '🎾', '🌙', '💗', '⭐'];

function startMemory() {
    if (memoryActive) return;
    memoryActive = true;
    memoryMatched = 0;
    memoryMoves = 0;
    memoryFlipped = [];

    // 创建8对卡片
    const emojis = [...MEMORY_EMOJIS, ...MEMORY_EMOJIS];
    // 洗牌
    for (let i = emojis.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [emojis[i], emojis[j]] = [emojis[j], emojis[i]];
    }

    const area = document.getElementById('memory-area');
    area.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'memory-grid';

    emojis.forEach((emoji, idx) => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.dataset.idx = idx;
        card.dataset.emoji = emoji;
        card.textContent = '?';
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
    });

    area.appendChild(grid);
    addLog('cat-log', '🐱 🃏 翻牌配对开始！找到所有配对！');
    addLog('dog-log', '🕶️ 🃏 考验记忆力的时候到了！');
    showToast('翻牌配对！找到所有相同的牌！', 'success');
}

function flipCard(card) {
    if (!memoryActive || card.classList.contains('flipped') || card.classList.contains('matched') || memoryFlipped.length >= 2) return;

    card.classList.add('flipped');
    card.textContent = card.dataset.emoji;
    memoryFlipped.push(card);

    if (memoryFlipped.length === 2) {
        memoryMoves++;
        const [a, b] = memoryFlipped;
        if (a.dataset.emoji === b.dataset.emoji) {
            a.classList.add('matched');
            b.classList.add('matched');
            memoryMatched++;
            memoryFlipped = [];
            if (memoryMatched === MEMORY_EMOJIS.length) {
                endMemory();
            }
        } else {
            setTimeout(() => {
                a.classList.remove('flipped');
                a.textContent = '?';
                b.classList.remove('flipped');
                b.textContent = '?';
                memoryFlipped = [];
            }, 600);
        }
    }
}

function endMemory() {
    memoryActive = false;
    const bonus = Math.max(5, 30 - memoryMoves);
    totalGameScore += bonus;
    localStorage.setItem('cangyv_game_score', totalGameScore);
    cat.mood = Math.min(100, cat.mood + 10);
    dog.mood = Math.min(100, dog.mood + 10);
    addAffection('cat', 3); addAffection('dog', 3);
    cat.doAction('happy'); dog.doAction('happy');
    updateGameHUD();
    const msg = `🃏 翻牌完成！${memoryMoves}步 → +${bonus}分`;
    addLog('cat-log', '🐱 ' + msg);
    addLog('dog-log', '🕶️ ' + msg);
    showToast(msg, 'success');
    setTimeout(() => { document.getElementById('memory-area').innerHTML = ''; }, 2000);
}

// ═══════════════════════════════════════
function spawnRipple(x, y) {

    el.className = 'click-ripple';
    el.style.left = (x - 15) + 'px';
    el.style.top = (y - 15) + 'px';
    scene.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

function spawnFloatNum(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-num';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color || '#fff';
    scene.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

function updateGameHUD() {
    const scoreEl = document.getElementById('game-score');
    const comboEl = document.getElementById('game-combo');
    scoreEl.textContent = totalGameScore;
    if (catchCombo >= 2) {
        comboEl.textContent = `x${catchCombo} 连击!`;
        comboEl.classList.add('show');
    } else {
        comboEl.classList.remove('show');
    }
}
updateGameHUD();

// ═══════════════════════════════════════
// 低状态提示 + 打瞌睡 + 边缘行为
// ═══════════════════════════════════════
setInterval(() => {
    updateHungryAlert('cat-wrap', cat);
    updateHungryAlert('dog-wrap', dog);
    if (cat.energy < 30 && cat.state === 'idle') cat.doAction('sleep');
    if (dog.energy < 30 && dog.state === 'idle') dog.doAction('sleep');
    if (cat.hunger < 20 || cat.mood < 20) {
        const cw = document.getElementById('cat-wrap');
        if (cw) cw.style.left = (Math.random() < 0.5 ? 2 : 88) + '%';
    }
    if (dog.hunger < 20 || dog.mood < 20) {
        const dw = document.getElementById('dog-wrap');
        if (dw) dw.style.left = (Math.random() < 0.5 ? 2 : 88) + '%';
    }
}, 3000);

function updateHungryAlert(wrapId, pet) {
    const wrap = document.getElementById(wrapId);
    if (!wrap) return;
    let alert = wrap.querySelector('.hungry-alert');
    if (pet.hunger < 30) {
        if (!alert) { alert = document.createElement('div'); alert.className = 'hungry-alert'; wrap.appendChild(alert); }
        alert.textContent = pet.hunger < 15 ? '🆘 好饿！' : '😵 饿了...';
    } else if (alert) { alert.remove(); }
}

// ═══════════════════════════════════════
// UI更新
// ═══════════════════════════════════════
function updateUI(prefix, s) {
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.style.width = v + '%'; };
    const setV = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = Math.round(v); };
    set(prefix + '-hunger', s.hunger); setV(prefix + '-hunger-val', s.hunger);
    set(prefix + '-mood', s.mood); setV(prefix + '-mood-val', s.mood);
    set(prefix + '-energy', s.energy); setV(prefix + '-energy-val', s.energy);
}

function addLog(containerId, msg) {
    const log = document.getElementById(containerId);
    if (!log) return;
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const now = new Date();
    entry.textContent = `[${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}] ${msg}`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
    while (log.children.length > 20) log.removeChild(log.firstChild);
}

// ── 宠物随机漫步 ──
setInterval(() => {
    const cw = document.getElementById('cat-wrap');
    const dw = document.getElementById('dog-wrap');
    if (cw) cw.style.left = (15 + Math.random() * 30) + '%';
    if (dw) dw.style.left = (50 + Math.random() * 30) + '%';
}, 12000);

// ── 同步后端状态 ──
async function syncBackend() {
    try {
        const res = await fetch('/api/pet');
        if (!res.ok) return;
        const data = await res.json();
        if (data.pets) {
            for (const p of data.pets) {
                const pet = p.name === '苍瞳' ? cat : (p.name === '玄镜' ? dog : null);
                if (pet && p.hunger !== undefined) {
                    pet.hunger = p.hunger; pet.mood = p.mood; pet.energy = p.energy;
                    pet.onStatsChange(pet.getStats());
                }
            }
        }
    } catch(e) {}
}
syncBackend();
setInterval(syncBackend, 30000);

// ── 清理 ──
window.addEventListener('beforeunload', () => {
    cat.stop(); dog.stop(); catAnim.stop(); dogAnim.stop();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
