<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共读器 · 苍聿居</title>
<style id="global-css"></style>
<style>
/* ═══ 页面布局 ═══ */
.coread-page {
  height: calc(100vh - var(--nav-h));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ═══ 视图切换 ═══ */
.view { display: none; flex: 1; overflow: hidden; }
.view.active { display: flex; }

/* ═══ 书架视图 ═══ */
.bookshelf-view {
  flex-direction: column;
  overflow-y: auto;
  padding: 20px;
}
.bookshelf-view::-webkit-scrollbar { width: 6px; }
.bookshelf-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.bookshelf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-shrink: 0;
}
.bookshelf-header h2 {
  font-size: 1.2rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.bookshelf-actions { display: flex; gap: 8px; }

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}

.book-card {
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.book-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px var(--shadow);
  border-color: var(--accent);
}
.book-card .book-cover {
  width: 100%;
  height: 100px;
  border-radius: var(--radius);
  background: var(--accentLight);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.book-card .book-cover::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: var(--accent);
  opacity: .5;
}
.book-card .book-title {
  font-size: .95rem;
  font-weight: 600;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-card .book-meta {
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.book-card .book-progress-wrap {
  width: 100%;
}
.book-card .book-progress-bar {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
}
.book-card .book-progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width .5s ease;
}
.book-card .book-progress-text {
  font-size: .7rem;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
}
.book-card .book-delete {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .8rem;
  background: var(--cardSolid);
  border: 1px solid var(--border);
  opacity: 0;
  transition: all .2s;
  cursor: pointer;
  z-index: 2;
}
.book-card:hover .book-delete { opacity: 1; }
.book-card .book-delete:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

.empty-shelf {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-shelf .icon { font-size: 3.5rem; margin-bottom: 12px; opacity: .6; }
.empty-shelf .title { font-size: 1.1rem; font-weight: 500; margin-bottom: 6px; }
.empty-shelf .desc { font-size: .85rem; line-height: 1.6; }

/* ═══ 导入视图 ═══ */
.import-view {
  flex-direction: column;
  overflow-y: auto;
  padding: 20px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}
.import-view::-webkit-scrollbar { width: 6px; }
.import-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.import-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.import-header .back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: background .2s;
}
.import-header .back-btn:hover { background: var(--accentLight); }
.import-header h2 { font-size: 1.2rem; font-weight: 700; }

.import-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label {
  font-size: .85rem;
  font-weight: 600;
  color: var(--muted);
}
.form-group input,
.form-group textarea {
  width: 100%;
}
.form-group textarea {
  min-height: 200px;
  font-size: .88rem;
  line-height: 1.7;
}

.file-upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.file-upload-area:hover {
  border-color: var(--accent);
  background: var(--accentLight);
}
.file-upload-area .upload-icon { font-size: 2rem; margin-bottom: 8px; }
.file-upload-area .upload-text { font-size: .85rem; color: var(--muted); }
.file-upload-area .upload-hint { font-size: .75rem; color: var(--muted); margin-top: 4px; opacity: .7; }
.file-upload-area input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.file-name {
  font-size: .82rem;
  color: var(--accent);
  margin-top: 6px;
}

.chapter-preview {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  max-height: 200px;
  overflow-y: auto;
}
.chapter-preview h4 {
  font-size: .85rem;
  color: var(--accent);
  margin-bottom: 10px;
}
.chapter-list {
  list-style: none;
  padding: 0;
  font-size: .82rem;
  color: var(--text);
}
.chapter-list li {
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.chapter-list li:last-child { border-bottom: none; }
.chapter-list .ch-num {
  color: var(--accent);
  font-weight: 600;
  min-width: 24px;
}

.import-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 8px;
}

/* ═══ 阅读视图 ═══ */
.reading-view {
  flex-direction: row;
  overflow: hidden;
}

/* 内容区 */
.reading-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.reading-top-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  flex-shrink: 0;
}
.reading-top-bar .back-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: background .2s;
  flex-shrink: 0;
}
.reading-top-bar .back-btn:hover { background: var(--accentLight); }
.reading-top-bar .book-info {
  flex: 1;
  min-width: 0;
}
.reading-top-bar .book-info .book-name {
  font-size: .9rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.reading-top-bar .book-info .chapter-name {
  font-size: .75rem;
  color: var(--muted);
}
.reading-top-bar .nav-btns {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.reading-top-bar .nav-btn {
  padding: 5px 12px;
  border-radius: var(--radius);
  font-size: .78rem;
  font-weight: 500;
  transition: all .2s;
  background: var(--accentLight);
  color: var(--accent);
}
.reading-top-bar .nav-btn:hover { background: var(--accent); color: #fff; }
.reading-top-bar .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
.reading-top-bar .chat-toggle-mobile {
  display: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: background .2s;
  flex-shrink: 0;
}
.reading-top-bar .chat-toggle-mobile:hover { background: var(--accentLight); }

/* 章节内容 */
.chapter-content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px 60px;
  line-height: 1.9;
  font-size: 1rem;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.chapter-content-area::-webkit-scrollbar { width: 6px; }
.chapter-content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.chapter-content-area .chapter-title-display {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--accent);
}
.chapter-content-area .chapter-text {
  white-space: pre-wrap;
  word-break: break-word;
}

/* 聊这段浮动按钮 */
.chat-selection-btn {
  position: fixed;
  display: none;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--accent);
  color: #fff;
  font-size: .8rem;
  font-weight: 500;
  box-shadow: 0 4px 16px var(--shadow);
  cursor: pointer;
  z-index: 500;
  transition: all .2s;
  white-space: nowrap;
}
.chat-selection-btn:hover { opacity: .9; transform: scale(1.05); }

/* ═══ 聊天侧边栏 ═══ */
.chat-sidebar {
  width: 360px;
  min-width: 360px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--cardSolid);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  z-index: 100;
}
.chat-sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chat-sidebar-header h3 {
  font-size: .9rem;
  font-weight: 600;
  flex: 1;
}
.chat-sidebar-header .close-chat-mobile {
  display: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  transition: background .2s;
}
.chat-sidebar-header .close-chat-mobile:hover { background: var(--accentLight); }

.chat-messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.chat-messages-area::-webkit-scrollbar { width: 4px; }
.chat-messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.chat-msg {
  display: flex;
  gap: 8px;
  max-width: 95%;
  animation: chatMsgIn .3s ease-out;
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg.assistant { align-self: flex-start; }
@keyframes chatMsgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  flex-shrink: 0;
  background: var(--accentLight);
}
.chat-msg.user .chat-msg-avatar { background: var(--accent); color: #fff; }

.chat-msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: .85rem;
  line-height: 1.6;
  word-break: break-word;
}
.chat-msg.assistant .chat-msg-bubble {
  background: var(--card);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
}
.chat-msg.user .chat-msg-bubble {
  background: var(--accent);
  color: #fff;
  border-top-right-radius: 4px;
}

/* Markdown in chat */
.chat-msg-bubble .md-content p { margin-bottom: .4em; }
.chat-msg-bubble .md-content p:last-child { margin-bottom: 0; }
.chat-msg-bubble .md-content strong { font-weight: 700; }
.chat-msg-bubble .md-content em { font-style: italic; }
.chat-msg-bubble .md-content code {
  background: var(--accentLight);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: .82em;
  font-family: 'SF Mono','Fira Code','Consolas',monospace;
}
.chat-msg.user .chat-msg-bubble code { background: rgba(255,255,255,.2); }
.chat-msg-bubble .md-content pre {
  background: var(--cardSolid);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  overflow-x: auto;
  margin: 6px 0;
}
.chat-msg-bubble .md-content pre code { background: none; padding: 0; font-size: .8em; }
.chat-msg-bubble .md-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 10px;
  margin: .4em 0;
  color: var(--muted);
}
.chat-msg-bubble .md-content ul, .chat-msg-bubble .md-content ol { padding-left: 1.4em; margin: .4em 0; }
.chat-msg-bubble .md-content li { margin-bottom: .2em; }

/* 打字指示器 */
.typing-dots {
  display: flex;
  gap: 4px;
  padding: 4px 0;
  align-items: center;
}
.typing-dots .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: typingBounce .6s ease-in-out infinite;
}
.typing-dots .dot:nth-child(2) { animation-delay: .1s; }
.typing-dots .dot:nth-child(3) { animation-delay: .2s; }
@keyframes typingBounce {
  0%, 80%, 100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1); opacity: 1; }
}

/* 聊天输入 */
.chat-input-area {
  padding: 10px 12px 14px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.chat-input-wrap textarea {
  flex: 1;
  min-height: 38px;
  max-height: 120px;
  padding: 8px 14px;
  border-radius: 20px;
  resize: none;
  line-height: 1.5;
  font-size: .85rem;
  overflow-y: auto;
  scrollbar-width: none;
}
.chat-input-wrap textarea::-webkit-scrollbar { display: none; }
.chat-send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  transition: all .2s;
  border: none;
  cursor: pointer;
}
.chat-send-btn:hover { opacity: .9; transform: scale(1.05); }
.chat-send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* 聊天空状态 */
.chat-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 8px;
  padding: 30px 16px;
  text-align: center;
}
.chat-empty .icon { font-size: 2rem; opacity: .5; }
.chat-empty .text { font-size: .82rem; line-height: 1.6; }

/* 聊天遮罩层 (移动端) */
.chat-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 99;
  opacity: 0;
  transition: opacity .3s;
}
.chat-overlay.active { opacity: 1; }

/* ═══ 删除确认模态框 ═══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--cardSolid);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 90%;
  max-width: 400px;
  transform: scale(.95);
  transition: transform .2s;
}
.modal-overlay.active .modal { transform: scale(1); }
.modal h3 { margin-bottom: 12px; font-size: 1.05rem; }
.modal p { font-size: .88rem; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ═══ 响应式 ═══ */
@media (max-width: 768px) {
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .book-card .book-cover { height: 80px; font-size: 1.8rem; }
  .book-card { padding: 12px; }

  .reading-view { flex-direction: column; }

  .chat-sidebar {
    position: fixed;
    top: var(--nav-h);
    right: 0;
    bottom: 0;
    width: 100%;
    min-width: unset;
    transform: translateX(100%);
    box-shadow: -4px 0 24px var(--shadow);
    z-index: 100;
  }
  .chat-sidebar.open { transform: translateX(0); }
  .chat-overlay { display: block; }
  .reading-top-bar .chat-toggle-mobile { display: flex; }
  .chat-sidebar-header .close-chat-mobile { display: flex; }

  .chapter-content-area { padding: 16px 16px 40px; font-size: .95rem; }

  .reading-top-bar .nav-btns .nav-btn-text { display: none; }
}
@media (min-width: 769px) {
  .mobile-only { display: none !important; }
}
@media (max-width: 480px) {
  .book-grid { grid-template-columns: 1fr 1fr; }
  .import-view { padding: 16px; }
}
</style>
</head>
<body>

<div id="nav-container"></div>

<div class="coread-page">
  <!-- ═══ 书架视图 ═══ -->
  <div class="view active" id="bookshelfView">
    <div class="bookshelf-view">
      <div class="bookshelf-header">
        <h2>📚 共读书架</h2>
        <div class="bookshelf-actions">
          <button class="btn btn-ghost btn-sm" onclick="showView('import')">📥 导入</button>
        </div>
      </div>
      <div id="bookGrid" class="book-grid"></div>
    </div>
  </div>

  <!-- ═══ 导入视图 ═══ -->
  <div class="view" id="importView">
    <div class="import-view">
      <div class="import-header">
        <button class="back-btn" onclick="showView('bookshelf')">←</button>
        <h2>📥 导入书籍</h2>
      </div>
      <div class="import-form">
        <div class="form-group">
          <label>书名</label>
          <input type="text" id="importTitle" placeholder="输入书名">
        </div>
        <div class="form-group">
          <label>上传文件</label>
          <div class="file-upload-area" id="fileUploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持 .txt / .md 文件（.docx 暂不支持，请转为 txt/md）</div>
            <input type="file" id="importFile" accept=".txt,.md,.docx">
          </div>
          <div class="file-name" id="fileName"></div>
        </div>
        <div class="form-group">
          <label>或粘贴文本</label>
          <textarea id="importText" placeholder="将文本内容粘贴到这里…"></textarea>
        </div>
        <div class="form-group" id="chapterPreviewGroup" style="display:none">
          <label>章节预览</label>
          <div class="chapter-preview">
            <h4 id="chapterCount">检测到 0 个章节</h4>
            <ul class="chapter-list" id="chapterList"></ul>
          </div>
        </div>
        <div class="import-actions">
          <button class="btn btn-ghost" onclick="showView('bookshelf')">取消</button>
          <button class="btn btn-primary" onclick="doImport()">导入书籍</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ 阅读视图 ═══ -->
  <div class="view" id="readingView">
    <div class="reading-view">
      <!-- 聊天遮罩 (移动端) -->
      <div class="chat-overlay" id="chatOverlay" onclick="toggleChatSidebar(false)"></div>

      <!-- 内容区 -->
      <div class="reading-content">
        <div class="reading-top-bar">
          <button class="back-btn" onclick="closeBook()" title="返回书架">←</button>
          <div class="book-info">
            <div class="book-name" id="readingBookName"></div>
            <div class="chapter-name" id="readingChapterName"></div>
          </div>
          <div class="nav-btns">
            <button class="nav-btn" id="prevBtn" onclick="prevChapter()">◀ <span class="nav-btn-text">上一章</span></button>
            <button class="nav-btn" id="nextBtn" onclick="nextChapter()"><span class="nav-btn-text">下一章</span> ▶</button>
          </div>
          <button class="chat-toggle-mobile" onclick="toggleChatSidebar(true)" title="聊天">💬</button>
        </div>
        <div class="chapter-content-area" id="chapterContentArea">
          <div class="chapter-title-display" id="chapterTitleDisplay"></div>
          <div class="chapter-text" id="chapterText"></div>
        </div>
      </div>

      <!-- 聊天侧边栏 -->
      <aside class="chat-sidebar" id="chatSidebar">
        <div class="chat-sidebar-header">
          <span>💬</span>
          <h3>共读讨论</h3>
          <button class="close-chat-mobile" onclick="toggleChatSidebar(false)">✕</button>
        </div>
        <div class="chat-messages-area" id="chatMessagesArea">
          <div class="chat-empty">
            <div class="icon">📖</div>
            <div class="text">选中段落文字后点击「聊这段」<br>或直接输入问题讨论本书</div>
          </div>
        </div>
        <div class="chat-input-area">
          <div class="chat-input-wrap">
            <textarea id="chatInput" placeholder="聊聊这本书…" rows="1" onkeydown="handleChatKeydown(event)"></textarea>
            <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()">➤</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- 聊这段浮动按钮 -->
<div class="chat-selection-btn" id="chatSelectionBtn" onclick="chatAboutSelection()">💬 聊这段</div>

<!-- 删除确认模态框 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>删除书籍</h3>
    <p id="deleteModalText">确定要删除这本书吗？所有阅读记录和聊天记录将无法恢复。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDeleteBook()">删除</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
(function() {
  // ── 常量 ──
  const BOOKSHELF_KEY = 'kico_bookshelf';
  const CHAT_KEY_PREFIX = 'kico_coread_chat_';
  const CHAPTER_REGEX = /^第[一二三四五六七八九十百零〇0-9]+[章节回篇部]|^Chapter\s+\d+|^Part\s+\d+|^序|^引子|^尾声/i;

  // ── 状态 ──
  let bookshelf = [];
  let currentBook = null;
  let chatHistory = [];
  let chatLoading = false;
  let pendingDeleteId = null;
  let selectedText = '';

  // ── 初始化 ──
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('global-css').textContent = GLOBAL_CSS;
    document.getElementById('nav-container').innerHTML = renderNav('reader');
    loadBookshelf();
    setupTextSelection();
    setupFileUpload();
    setupImportPreview();
    setupChatInputResize();
  });

  // ── 视图切换 ──
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const viewId = name + 'View';
    const el = document.getElementById(viewId);
    if (el) el.classList.add('active');
    if (name === 'bookshelf') renderBookshelf();
  }
  window.showView = showView;

  // ══════════════════════════════════════════
  //  书架
  // ══════════════════════════════════════════

  function loadBookshelf() {
    try {
      const raw = localStorage.getItem(BOOKSHELF_KEY);
      bookshelf = raw ? JSON.parse(raw) : [];
    } catch (e) {
      bookshelf = [];
    }
    renderBookshelf();
  }

  function saveBookshelf() {
    localStorage.setItem(BOOKSHELF_KEY, JSON.stringify(bookshelf));
    pushKicoBooklist();
  }

  function renderBookshelf() {
    const grid = document.getElementById('bookGrid');
    if (!bookshelf.length) {
      grid.innerHTML = `<div class="empty-shelf">
        <div class="icon">📚</div>
        <div class="title">书架空空如也</div>
        <div class="desc">点击右上角「导入」添加一本书开始共读吧</div>
      </div>`;
      return;
    }
    grid.innerHTML = bookshelf.map(book => {
      const progress = book.sections.length > 0
        ? Math.round((book.currentSection / book.sections.length) * 100)
        : 0;
      const currentTitle = book.sections[book.currentSection]
        ? book.sections[book.currentSection].title
        : '未开始';
      const emoji = getBookEmoji(book.title);
      return `<div class="book-card" onclick="openBook('${book.id}')">
        <button class="book-delete" onclick="event.stopPropagation();askDeleteBook('${book.id}')" title="删除">✕</button>
        <div class="book-cover">${emoji}</div>
        <div class="book-title">${escapeHtml(book.title)}</div>
        <div class="book-meta">
          <span>📖 ${book.sections.length} 章</span>
          <span>📍 ${escapeHtml(currentTitle)}</span>
        </div>
        <div class="book-progress-wrap">
          <div class="book-progress-bar"><div class="book-progress-fill" style="width:${progress}%"></div></div>
          <div class="book-progress-text">
            <span>${escapeHtml(currentTitle)}</span>
            <span>${progress}%</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function getBookEmoji(title) {
    const emojis = ['📕','📗','📘','📙','📓','📔','📒','📖'];
    let hash = 0;
    for (let i = 0; i < title.length; i++) hash = ((hash << 5) - hash + title.charCodeAt(i)) | 0;
    return emojis[Math.abs(hash) % emojis.length];
  }

  // ── 删除书籍 ──
  function askDeleteBook(id) {
    pendingDeleteId = id;
    const book = bookshelf.find(b => b.id === id);
    document.getElementById('deleteModalText').textContent =
      `确定要删除「${book ? book.title : ''}」吗？所有阅读记录和聊天记录将无法恢复。`;
    document.getElementById('deleteModal').classList.add('active');
  }
  window.askDeleteBook = askDeleteBook;

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
    pendingDeleteId = null;
  }
  window.closeDeleteModal = closeDeleteModal;

  function confirmDeleteBook() {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    bookshelf = bookshelf.filter(b => b.id !== id);
    localStorage.removeItem(CHAT_KEY_PREFIX + id);
    saveBookshelf();
    closeDeleteModal();
    showToast('已删除', 'success');
  }
  window.confirmDeleteBook = confirmDeleteBook;

  // ══════════════════════════════════════════
  //  导入
  // ══════════════════════════════════════════

  function setupFileUpload() {
    const fileInput = document.getElementById('importFile');
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const nameEl = document.getElementById('fileName');
      if (file.name.endsWith('.docx')) {
        nameEl.textContent = '⚠️ .docx 格式暂不支持浏览器端解析，请转为 .txt 或 .md 后导入';
        nameEl.style.color = '#e74c3c';
        fileInput.value = '';
        return;
      }
      nameEl.textContent = '📎 ' + file.name;
      nameEl.style.color = '';
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('importText').value = ev.target.result;
        updateChapterPreview();
      };
      reader.readAsText(file);
    });
  }

  function setupImportPreview() {
    document.getElementById('importText').addEventListener('input', updateChapterPreview);
  }

  function updateChapterPreview() {
    const text = document.getElementById('importText').value.trim();
    const group = document.getElementById('chapterPreviewGroup');
    if (!text) {
      group.style.display = 'none';
      return;
    }
    const sections = parseSections(text);
    group.style.display = '';
    document.getElementById('chapterCount').textContent = `检测到 ${sections.length} 个章节`;
    const list = document.getElementById('chapterList');
    list.innerHTML = sections.map((s, i) =>
      `<li><span class="ch-num">${i + 1}.</span> ${escapeHtml(s.title)}</li>`
    ).join('');
  }

  function parseSections(text) {
    const lines = text.split('\n');
    const sections = [];
    let currentTitle = '序';
    let currentLines = [];

    for (const line of lines) {
      if (CHAPTER_REGEX.test(line.trim())) {
        if (currentLines.length > 0 || currentTitle !== '序') {
          sections.push({
            id: 's_' + sections.length,
            title: currentTitle,
            text: currentLines.join('\n').trim()
          });
        }
        currentTitle = line.trim();
        currentLines = [];
      } else {
        currentLines.push(line);
      }
    }
    // 最后一个章节
    if (currentLines.length > 0 || currentTitle !== '序') {
      sections.push({
        id: 's_' + sections.length,
        title: currentTitle,
        text: currentLines.join('\n').trim()
      });
    }

    // 如果没有检测到章节，整篇作为一个章节
    if (sections.length === 0 && text.trim()) {
      sections.push({
        id: 's_0',
        title: '全文',
        text: text.trim()
      });
    }

    return sections;
  }

  function doImport() {
    const title = document.getElementById('importTitle').value.trim();
    const text = document.getElementById('importText').value.trim();

    if (!title) { showToast('请输入书名', 'error'); return; }
    if (!text) { showToast('请输入或上传文本内容', 'error'); return; }

    const sections = parseSections(text);
    if (!sections.length) { showToast('未能解析出任何内容', 'error'); return; }

    const book = {
      id: 'book_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      title: title,
      sections: sections,
      currentSection: 0,
      lastReadAt: Date.now(),
      createdAt: Date.now()
    };

    bookshelf.push(book);
    saveBookshelf();

    // 清空表单
    document.getElementById('importTitle').value = '';
    document.getElementById('importText').value = '';
    document.getElementById('importFile').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('chapterPreviewGroup').style.display = 'none';

    showToast(`「${title}」导入成功，共 ${sections.length} 章`, 'success');
    showView('bookshelf');
  }
  window.doImport = doImport;

  // ══════════════════════════════════════════
  //  阅读视图
  // ══════════════════════════════════════════

  function openBook(id) {
    const book = bookshelf.find(b => b.id === id);
    if (!book) { showToast('书籍不存在', 'error'); return; }

    currentBook = book;
    currentBook.lastReadAt = Date.now();
    saveBookshelf();

    loadChatHistory();
    renderReadingView();
    showView('reading');
    pushKicoState(true);

    // 滚动到上次阅读位置
    requestAnimationFrame(() => {
      const area = document.getElementById('chapterContentArea');
      area.scrollTop = 0;
    });
  }
  window.openBook = openBook;

  function closeBook() {
    if (currentBook) {
      currentBook.lastReadAt = Date.now();
      saveBookshelf();
      pushKicoState(false);
    }
    currentBook = null;
    chatHistory = [];
    toggleChatSidebar(false);
    showView('bookshelf');
  }
  window.closeBook = closeBook;

  function renderReadingView() {
    if (!currentBook) return;
    document.getElementById('readingBookName').textContent = currentBook.title;
    renderChapter();
    renderChatMessages();
  }

  function renderChapter() {
    if (!currentBook) return;
    const idx = currentBook.currentSection;
    const section = currentBook.sections[idx];
    if (!section) return;

    document.getElementById('readingChapterName').textContent =
      `${idx + 1} / ${currentBook.sections.length} · ${section.title}`;
    document.getElementById('chapterTitleDisplay').textContent = section.title;
    document.getElementById('chapterText').textContent = section.text;

    document.getElementById('prevBtn').disabled = idx <= 0;
    document.getElementById('nextBtn').disabled = idx >= currentBook.sections.length - 1;

    // 滚动到顶部
    const area = document.getElementById('chapterContentArea');
    area.scrollTop = 0;

    // 保存进度
    currentBook.lastReadAt = Date.now();
    saveBookshelf();
    pushKicoState(true);
  }

  function prevChapter() {
    if (!currentBook || currentBook.currentSection <= 0) return;
    currentBook.currentSection--;
    renderChapter();
  }
  window.prevChapter = prevChapter;

  function nextChapter() {
    if (!currentBook || currentBook.currentSection >= currentBook.sections.length - 1) return;
    currentBook.currentSection++;
    renderChapter();
  }
  window.nextChapter = nextChapter;

  // ── 选中文本 → 聊这段 ──
  function setupTextSelection() {
    const contentArea = document.getElementById('chapterContentArea');
    const btn = document.getElementById('chatSelectionBtn');

    document.addEventListener('mouseup', (e) => {
      // 只在阅读视图激活时处理
      if (!document.getElementById('readingView').classList.contains('active')) {
        btn.style.display = 'none';
        return;
      }
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : '';
      if (text.length > 2 && contentArea.contains(sel.anchorNode)) {
        selectedText = text;
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        btn.style.display = 'block';
        btn.style.top = (rect.top + window.scrollY - 40) + 'px';
        btn.style.left = (rect.left + rect.width / 2 - 50) + 'px';
      } else {
        btn.style.display = 'none';
        selectedText = '';
      }
    });

    document.addEventListener('mousedown', () => {
      // 延迟隐藏，避免点击按钮时立即消失
      setTimeout(() => {
        if (!btn.matches(':hover')) {
          btn.style.display = 'none';
        }
      }, 200);
    });
  }

  function chatAboutSelection() {
    if (!selectedText || !currentBook) return;
    const btn = document.getElementById('chatSelectionBtn');
    btn.style.display = 'none';

    const section = currentBook.sections[currentBook.currentSection];
    const excerpt = selectedText.length > 300 ? selectedText.slice(0, 300) + '…' : selectedText;
    const msg = `关于「${currentBook.title}」${section ? section.title : ''}中的一段内容：\n「${excerpt}」\n请帮我分析讨论这段内容。`;

    document.getElementById('chatInput').value = msg;
    sendChatMessage();
    selectedText = '';
  }
  window.chatAboutSelection = chatAboutSelection;

  // ══════════════════════════════════════════
  //  聊天侧边栏
  // ══════════════════════════════════════════

  function toggleChatSidebar(open) {
    const sidebar = document.getElementById('chatSidebar');
    const overlay = document.getElementById('chatOverlay');
    if (open) {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      overlay.style.display = 'block';
    } else {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      setTimeout(() => { overlay.style.display = 'none'; }, 300);
    }
  }
  window.toggleChatSidebar = toggleChatSidebar;

  // ── 聊天历史 ──
  function loadChatHistory() {
    if (!currentBook) return;
    try {
      const raw = localStorage.getItem(CHAT_KEY_PREFIX + currentBook.id);
      chatHistory = raw ? JSON.parse(raw) : [];
    } catch (e) {
      chatHistory = [];
    }
  }

  function saveChatHistory() {
    if (!currentBook) return;
    localStorage.setItem(CHAT_KEY_PREFIX + currentBook.id, JSON.stringify(chatHistory));
  }

  function renderChatMessages() {
    const area = document.getElementById('chatMessagesArea');
    if (!chatHistory.length) {
      area.innerHTML = `<div class="chat-empty">
        <div class="icon">📖</div>
        <div class="text">选中段落文字后点击「聊这段」<br>或直接输入问题讨论本书</div>
      </div>`;
      return;
    }
    area.innerHTML = chatHistory.map(msg => renderChatMsg(msg)).join('');
    scrollChatToBottom();
  }

  function renderChatMsg(msg) {
    const isUser = msg.role === 'user';
    const avatar = isUser ? '👤' : '🤖';
    const content = isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content);
    return `<div class="chat-msg ${msg.role}">
      <div class="chat-msg-avatar">${avatar}</div>
      <div class="chat-msg-bubble"><div class="md-content">${content}</div></div>
    </div>`;
  }

  function appendChatMsg(msg) {
    const area = document.getElementById('chatMessagesArea');
    const empty = area.querySelector('.chat-empty');
    if (empty) empty.remove();
    area.insertAdjacentHTML('beforeend', renderChatMsg(msg));
    scrollChatToBottom();
  }

  function scrollChatToBottom() {
    requestAnimationFrame(() => {
      const area = document.getElementById('chatMessagesArea');
      area.scrollTop = area.scrollHeight;
    });
  }

  function showChatTyping() {
    const area = document.getElementById('chatMessagesArea');
    const empty = area.querySelector('.chat-empty');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = 'chat-msg assistant';
    el.id = 'chatTypingIndicator';
    el.innerHTML = `<div class="chat-msg-avatar">🤖</div>
      <div class="chat-msg-bubble">
        <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>`;
    area.appendChild(el);
    scrollChatToBottom();
  }

  function removeChatTyping() {
    const el = document.getElementById('chatTypingIndicator');
    if (el) el.remove();
  }

  function showChatError(msg) {
    const area = document.getElementById('chatMessagesArea');
    const el = document.createElement('div');
    el.className = 'chat-msg assistant';
    el.innerHTML = `<div class="chat-msg-avatar">⚠️</div>
      <div class="chat-msg-bubble" style="color:#e74c3c">${escapeHtml(msg)}</div>`;
    area.appendChild(el);
    scrollChatToBottom();
    setTimeout(() => el.remove(), 5000);
  }

  // ── 发送聊天消息 ──
  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentBook || chatLoading) return;

    // 用户消息
    const userMsg = { role: 'user', content: text, ts: Date.now() };
    chatHistory.push(userMsg);
    appendChatMsg(userMsg);
    input.value = '';
    autoResizeChatInput();

    // 构建带上下文的消息
    const section = currentBook.sections[currentBook.currentSection];
    const contextPrefix = `[共读上下文] 书名：「${currentBook.title}」，当前章节：${section ? section.title : '未知'}\n\n`;
    const fullMessage = contextPrefix + text;

    chatLoading = true;
    updateChatSendBtn();
    showChatTyping();

    try {
      const sessionKey = 'kico_coread_' + currentBook.id;
      const resp = await apiPost('/api/v1/chat', {
        session_key: sessionKey,
        message: fullMessage
      });

      removeChatTyping();
      const assistantMsg = {
        role: 'assistant',
        content: resp.reply || resp.message || '(空回复)',
        ts: Date.now()
      };
      chatHistory.push(assistantMsg);
      appendChatMsg(assistantMsg);
      saveChatHistory();
    } catch (e) {
      removeChatTyping();
      showChatError(e.message || '发送失败');
    } finally {
      chatLoading = false;
      updateChatSendBtn();
    }
  }
  window.sendChatMessage = sendChatMessage;

  function handleChatKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChatMessage();
    }
  }
  window.handleChatKeydown = handleChatKeydown;

  function updateChatSendBtn() {
    const btn = document.getElementById('chatSendBtn');
    btn.disabled = chatLoading;
    btn.innerHTML = chatLoading
      ? '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div>'
      : '➤';
  }

  function setupChatInputResize() {
    const textarea = document.getElementById('chatInput');
    textarea.addEventListener('input', autoResizeChatInput);
  }

  function autoResizeChatInput() {
    const textarea = document.getElementById('chatInput');
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  }

  // ── Markdown 渲染（基础） ──
  function renderMarkdown(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    // 代码块
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code class="lang-${lang}">${code.trim()}</code></pre>`);
    // 行内代码
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 粗体
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // 斜体
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // 引用
    html = html.replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>');
    // 无序列表
    html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
    // 段落
    html = html.replace(/\n\n+/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p>\s*<\/p>/g, '');
    html = html.replace(/<p>(<blockquote>)/g, '$1');
    html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
    html = html.replace(/<p>(<pre>)/g, '$1');
    html = html.replace(/(<\/pre>)<\/p>/g, '$1');
    html = html.replace(/<p>(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)<\/p>/g, '$1');
    return html;
  }

  // ══════════════════════════════════════════
  //  KICO 状态推送
  // ══════════════════════════════════════════

  async function pushKicoState(active) {
    if (!currentBook) return;
    try {
      const section = currentBook.sections[currentBook.currentSection];
      const progress = currentBook.sections.length > 0
        ? Math.round((currentBook.currentSection / currentBook.sections.length) * 100)
        : 0;
      await apiPost('/api/v1/kico/state', {
        active: !!active,
        book_id: currentBook.id,
        book_title: currentBook.title,
        section_index: currentBook.currentSection,
        section_title: section ? section.title : '',
        progress: progress
      });
    } catch (e) {
      // 静默失败
      console.warn('KICO state push failed:', e);
    }
  }

  async function pushKicoBooklist() {
    try {
      const list = bookshelf.map(b => ({
        id: b.id,
        title: b.title,
        sections: b.sections.length,
        currentSection: b.currentSection,
        lastReadAt: b.lastReadAt
      }));
      await apiPost('/api/v1/kico/booklist', list);
    } catch (e) {
      console.warn('KICO booklist push failed:', e);
    }
  }

  // ── 模态框关闭 ──
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) {
      e.target.classList.remove('active');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
      toggleChatSidebar(false);
    }
  });

  // ── 键盘快捷键 ──
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('readingView').classList.contains('active')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') prevChapter();
    if (e.key === 'ArrowRight') nextChapter();
  });
})();
