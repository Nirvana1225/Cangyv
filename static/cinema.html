<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>观影室 · 苍聿居</title>
<style id="global-css">
/* 由 JS 注入 GLOBAL_CSS */
</style>
<style>

/* ── 观影室布局 ── */
.cinema-layout {
  display: flex;
  height: calc(100vh - var(--nav-h));
  overflow: hidden;
}

/* ── 视频舞台 ── */
.cinema-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
  min-width: 0;
}

.cinema-player-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #000;
}

.cinema-iframe {
  flex: 1;
  width: 100%;
  border: none;
  min-height: 300px;
}

.cinema-player-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--cardSolid);
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--border);
}

.cinema-source-label {
  color: var(--muted);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .82rem;
}

.cinema-player-footer .text-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--accent);
  background: var(--accentLight);
  cursor: pointer;
  border: none;
  transition: all .15s;
  white-space: nowrap;
}
.cinema-player-footer .text-btn:hover {
  background: var(--accent);
  color: #fff;
}

/* ── 空状态 ── */
.cinema-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  color: rgba(255,255,255,.5);
  text-align: center;
  padding: 40px;
  width: 100%;
}
.cinema-empty p {
  font-size: .9rem;
  line-height: 1.6;
}
.cinema-play-icon {
  font-size: 4rem;
  opacity: .25;
}

.cinema-url-input {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 500px;
}
.cinema-url-input input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--inputBg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.cinema-url-input input:focus {
  border-color: var(--accent);
}
.cinema-url-input .load-btn {
  padding: 10px 20px;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: .875rem;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.cinema-url-input .load-btn:hover {
  opacity: .9;
}
.cinema-url-input .load-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.cinema-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.cinema-action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: var(--radius);
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.6);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.cinema-action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── 陪看切换按钮（手机适配） ── */
.cinema-toggle-btn {
  display: none;
  width: 100%;
  padding: 10px;
  border: none;
  border-top: 1px solid var(--border);
  background: var(--cardSolid);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .15s;
}
.cinema-toggle-btn:hover {
  background: var(--accentLight);
  color: var(--accent);
}

/* ── 陪看侧边栏 ── */
.cinema-sidebar {
  width: 300px;
  background: var(--cardSolid);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: none;
}
.cinema-sidebar.collapsed {
  display: none;
}

.cinema-sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
  font-weight: 600;
  color: var(--text);
}
.cinema-sidebar-header .fullscreen-btn {
  font-size: .78rem;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 8px;
  border-radius: 6px;
  transition: background .15s;
}
.cinema-sidebar-header .fullscreen-btn:hover {
  background: var(--accentLight);
}

.cinema-sidebar-body {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.cinema-sidebar-body::-webkit-scrollbar { width: 4px; }
.cinema-sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.cinema-sidebar-hint {
  font-size: .82rem;
  color: var(--muted);
  line-height: 1.7;
  text-align: center;
  padding: 30px 10px;
}

/* ── 聊天气泡 ── */
.cinema-chat-bubble {
  padding: 8px 12px;
  border-radius: 10px;
  font-size: .84rem;
  line-height: 1.6;
  word-wrap: break-word;
  max-width: 100%;
  animation: bubbleIn .25s ease-out;
}
@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.cinema-chat-bubble.user {
  background: var(--accent);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 3px;
}
.cinema-chat-bubble.companion {
  background: var(--card);
  color: var(--text);
  align-self: flex-start;
  border-left: 3px solid var(--accent);
  border-top-left-radius: 3px;
}

.cinema-chat-text {
  white-space: pre-wrap;
}

.cinema-chat-meta {
  font-size: .65rem;
  color: var(--muted);
  margin-top: 4px;
  opacity: .7;
}

.cinema-chat-loading {
  font-size: .78rem;
  color: var(--muted);
  padding: 6px 0;
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cinema-chat-loading .dot-anim {
  display: inline-flex;
  gap: 3px;
}
.cinema-chat-loading .dot-anim span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--muted);
  animation: dotBounce .6s ease-in-out infinite;
}
.cinema-chat-loading .dot-anim span:nth-child(2) { animation-delay: .1s; }
.cinema-chat-loading .dot-anim span:nth-child(3) { animation-delay: .2s; }
@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── 输入栏 ── */
.cinema-chat-input-bar {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--cardSolid);
  align-items: center;
}
.cinema-chat-input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--inputBg);
  color: var(--text);
  font-size: .84rem;
  outline: none;
  min-height: 36px;
}
.cinema-chat-input:focus {
  border-color: var(--accent);
}
.cinema-chat-input:disabled {
  opacity: .5;
}
.cinema-chat-send {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
  font-size: 1rem;
}
.cinema-chat-send:hover:not(:disabled) {
  opacity: .9;
}
.cinema-chat-send:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* ── 延迟回复按钮 ── */
.flush-btn {
  font-size: .72rem;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--accentLight);
  color: var(--accent);
  border: none;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all .15s;
}
.flush-btn:hover {
  background: var(--accent);
  color: #fff;
}

/* ── 响应式 ── */
@media (max-width: 768px) {
  .cinema-layout {
    flex-direction: column;
  }
  .cinema-stage {
    min-height: 240px;
  }
  .cinema-sidebar {
    width: 100%;
    max-height: 40vh;
    border-left: none;
    border-top: 1px solid var(--border);
  }
  .cinema-toggle-btn {
    display: block;
  }
}
</style>
</head>
<body>

<div id="nav-container"></div>

<div class="cinema-layout">
  <!-- 视频区域 -->
  <div class="cinema-stage" id="cinemaStage">
    <div class="cinema-empty" id="cinemaEmpty">
      <div class="cinema-play-icon">▶️</div>
      <p>输入 B站链接开始观影</p>
      <div class="cinema-url-input">
        <input type="text" id="bilibiliUrlInput" placeholder="粘贴 B站视频链接..." onkeydown="if(event.key==='Enter')handleLoad()">
        <button class="load-btn" id="loadBtn" onclick="handleLoad()">加载</button>
      </div>
      <div class="cinema-actions">
        <button class="cinema-action-btn" onclick="location.href='/chat'">💬 陪看对话</button>
        <button class="cinema-action-btn" onclick="location.href='/panel'">⚙️ 控制面板</button>
      </div>
    </div>
  </div>

  <!-- 陪看切换按钮（手机用） -->
  <button class="cinema-toggle-btn" id="toggleBtn" onclick="toggleSidebar()">展开陪看 ▼</button>

  <!-- 陪看对话面板 -->
  <div class="cinema-sidebar" id="cinemaSidebar">
    <div class="cinema-sidebar-header">
      <span id="sidebarTitle">🎬 陪看 · 未播放</span>
      <button class="fullscreen-btn" onclick="location.href='/chat'">全屏对话</button>
    </div>
    <div class="cinema-sidebar-body" id="cinemaChatBody">
      <div class="cinema-sidebar-hint" id="chatHint">
        加载视频后，AI 会在这里陪你一起看。<br>
        可以吐槽剧情、分析镜头、聊聊背后的设定。
      </div>
    </div>
    <div class="cinema-chat-input-bar">
      <button class="flush-btn" id="flushBtn" style="display:none" onclick="flushPending()">结束等待</button>
      <input class="cinema-chat-input" id="cinemaInput" placeholder="先加载视频吧" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleCinemaSend()}" disabled>
      <button class="cinema-chat-send" id="cinemaSendBtn" onclick="handleCinemaSend()" disabled>➤</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
// ── 注入全局 CSS ──
(function() {
  const globalStyle = document.getElementById('global-css');
  if (globalStyle && typeof GLOBAL_CSS !== 'undefined') {
    globalStyle.textContent = GLOBAL_CSS;
  }
})();

// ── 状态 ──
let frameSource = null;    // { platform, keyword, url, originalUrl, embedUrl, mode, title }
let frameVisible = false;
let sidebarOpen = true;
let cinemaMessages = [];   // { id, role, text, createdAt }
let cinemaLoading = false;
let prevVideoTitle = '';

// 延迟回复
let delayedPending = false;
let delayTimer = null;
let pendingTexts = [];

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  $('#nav-container').innerHTML = renderNav('panel');
  loadChatHistory();
  renderChat();
});

// ── B站 URL 解析 ──
function isHttpUrl(s) {
  return /^https?:\/\//i.test(s.trim());
}

function buildBilibiliEmbedUrl(rawUrl) {
  try {
    const parsed = new URL(rawUrl);
    const videoMatch = parsed.pathname.match(/\/video\/(BV[a-zA-Z0-9]+|av\d+)/i);
    if (!videoMatch) return undefined;

    const videoId = videoMatch[1];
    const page = parsed.searchParams.get('p') || '1';
    const embed = new URL('https://player.bilibili.com/player.html');

    if (/^BV/i.test(videoId)) {
      embed.searchParams.set('bvid', videoId);
    } else {
      embed.searchParams.set('aid', videoId.replace(/^av/i, ''));
    }
    embed.searchParams.set('page', page);
    embed.searchParams.set('autoplay', '0');
    embed.searchParams.set('danmaku', '0');
    return embed.toString();
  } catch (e) {
    return undefined;
  }
}

function createBilibiliFrameSource(keyword) {
  const trimmed = keyword.trim();
  const isUrl = isHttpUrl(trimmed);
  const embedUrl = isUrl ? buildBilibiliEmbedUrl(trimmed) : undefined;
  const useEmbed = !!embedUrl && embedUrl !== trimmed;
  return {
    platform: 'bilibili',
    keyword: trimmed,
    originalUrl: isUrl ? trimmed : undefined,
    embedUrl: embedUrl,
    mode: useEmbed ? 'embed' : undefined,
    url: useEmbed ? embedUrl : (isUrl ? trimmed : 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(trimmed)),
    title: isUrl ? 'B站视频' : 'B站 · ' + trimmed,
  };
}

// ── 加载视频 ──
function handleLoad() {
  const input = $('#bilibiliUrlInput');
  const url = input.value.trim();
  if (!url) return;

  frameSource = createBilibiliFrameSource(url);
  frameVisible = true;
  renderPlayer();

  // 自动启动陪看
  if (frameSource.title !== prevVideoTitle) {
    prevVideoTitle = frameSource.title;
    const contextText = '我正在看 ' + frameSource.title + (frameSource.embedUrl ? '，弹幕已关闭' : '') + '。陪我看好不好？';
    const contextMsg = {
      id: genId(),
      role: 'user',
      text: contextText,
      createdAt: new Date().toISOString(),
    };
    cinemaMessages.push(contextMsg);
    saveChatHistory();
    renderChat();
    doCinemaSend(contextText);
  }
}

// ── 渲染播放器 ──
function renderPlayer() {
  const stage = $('#cinemaStage');

  if (frameSource && frameVisible) {
    stage.innerHTML = '<div class="cinema-player-wrapper">' +
      '<iframe title="' + escapeHtml(frameSource.title) + '" src="' + escapeHtml(frameSource.url) + '" class="cinema-iframe" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen" allowfullscreen></iframe>' +
      '<div class="cinema-player-footer">' +
        '<span class="cinema-source-label">' + escapeHtml(frameSource.title) + '</span>' +
        (frameSource.embedUrl && frameSource.originalUrl
          ? '<button class="text-btn" onclick="toggleEmbedMode()">🔗 切换内嵌/原站</button>'
          : '') +
        '<button class="text-btn" onclick="closeVideo()" style="margin-left:auto">✕ 关闭</button>' +
      '</div>' +
    '</div>';
  } else {
    stage.innerHTML = '<div class="cinema-empty" id="cinemaEmpty">' +
      '<div class="cinema-play-icon">▶️</div>' +
      '<p>输入 B站链接开始观影</p>' +
      '<div class="cinema-url-input">' +
        '<input type="text" id="bilibiliUrlInput" placeholder="粘贴 B站视频链接..." onkeydown="if(event.key===\'Enter\')handleLoad()">' +
        '<button class="load-btn" id="loadBtn" onclick="handleLoad()">加载</button>' +
      '</div>' +
      '<div class="cinema-actions">' +
        '<button class="cinema-action-btn" onclick="location.href=\'/chat\'">💬 陪看对话</button>' +
        '<button class="cinema-action-btn" onclick="location.href=\'/panel\'">⚙️ 控制面板</button>' +
      '</div>' +
    '</div>';
  }

  // 更新侧边栏标题和输入状态
  updateSidebarState();
}

function closeVideo() {
  frameVisible = false;
  frameSource = null;
  prevVideoTitle = '';
  renderPlayer();
}

function toggleEmbedMode() {
  if (!frameSource || !frameSource.embedUrl || !frameSource.originalUrl) return;
  const usePage = frameSource.url === frameSource.embedUrl;
  frameSource.url = usePage ? frameSource.originalUrl : frameSource.embedUrl;
  renderPlayer();
}

// ── 侧边栏切换 ──
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  const sidebar = $('#cinemaSidebar');
  const btn = $('#toggleBtn');
  if (sidebarOpen) {
    sidebar.classList.remove('collapsed');
    btn.textContent = '收起陪看 ▲';
  } else {
    sidebar.classList.add('collapsed');
    btn.textContent = '展开陪看 ▼';
  }
}

function updateSidebarState() {
  const title = $('#sidebarTitle');
  const input = $('#cinemaInput');
  const sendBtn = $('#cinemaSendBtn');

  if (frameSource) {
    title.textContent = '🎬 陪看 · ' + frameSource.title;
    input.disabled = cinemaLoading;
    input.placeholder = cinemaLoading ? '思考中...' : '吐槽两句...';
    sendBtn.disabled = cinemaLoading;
  } else {
    title.textContent = '🎬 陪看 · 未播放';
    input.disabled = true;
    input.placeholder = '先加载视频吧';
    sendBtn.disabled = true;
  }
}

// ── 聊天历史持久化 ──
const CHAT_STORAGE_KEY = 'kico_cinema_chat';

function loadChatHistory() {
  try {
    const raw = localStorage.getItem(CHAT_STORAGE_KEY);
    if (raw) {
      cinemaMessages = JSON.parse(raw);
    }
  } catch (e) {
    cinemaMessages = [];
  }
}

function saveChatHistory() {
  try {
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(cinemaMessages));
  } catch (e) {
    // ignore quota errors
  }
}

// ── 渲染聊天 ──
function renderChat() {
  const body = $('#cinemaChatBody');

  if (cinemaMessages.length === 0) {
    body.innerHTML = '<div class="cinema-sidebar-hint" id="chatHint">' +
      '加载视频后，AI 会在这里陪你一起看。<br>' +
      '可以吐槽剧情、分析镜头、聊聊背后的设定。' +
    '</div>';
    return;
  }

  let html = '';
  for (const msg of cinemaMessages) {
    const cls = msg.role === 'user' ? 'user' : 'companion';
    const meta = msg.modelUsed ? '<div class="cinema-chat-meta">' + escapeHtml(msg.modelUsed) + '</div>' : '';
    html += '<div class="cinema-chat-bubble ' + cls + '">' +
      '<div class="cinema-chat-text">' + escapeHtml(msg.text) + '</div>' +
      meta +
    '</div>';
  }

  if (cinemaLoading) {
    html += '<div class="cinema-chat-loading">思考中' +
      '<span class="dot-anim"><span></span><span></span><span></span></span>' +
    '</div>';
  }

  body.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    const body = $('#cinemaChatBody');
    body.scrollTop = body.scrollHeight;
  });
}

// ── 发送陪看消息 ──
function handleCinemaSend() {
  const input = $('#cinemaInput');
  const text = input.value.trim();
  if (!text || cinemaLoading || !frameSource) return;
  input.value = '';

  const userMsg = {
    id: genId(),
    role: 'user',
    text: text,
    createdAt: new Date().toISOString(),
  };
  cinemaMessages.push(userMsg);
  saveChatHistory();
  renderChat();

  // 检查延迟回复设置
  const delayCfg = getDelayedSettings();
  if (delayCfg.enabled) {
    pendingTexts.push(text);
    delayedPending = true;
    $('#flushBtn').style.display = '';
    clearTimeout(delayTimer);
    delayTimer = setTimeout(() => flushPending(), delayCfg.delay);
  } else {
    doCinemaSend(text);
  }
}

function flushPending() {
  clearTimeout(delayTimer);
  const texts = pendingTexts.slice();
  pendingTexts = [];
  delayedPending = false;
  $('#flushBtn').style.display = 'none';
  if (texts.length > 0) {
    doCinemaSend(texts.join('\n———\n'));
  }
}

function getDelayedSettings() {
  try {
    const raw = localStorage.getItem('kico_ombre_uplink_v1');
    if (!raw) return { enabled: false, delay: 10000 };
    const s = JSON.parse(raw);
    return { enabled: s.delayedReply === true, delay: s.delayMs || 10000 };
  } catch (e) {
    return { enabled: false, delay: 10000 };
  }
}

async function doCinemaSend(text) {
  if (cinemaLoading) return;
  cinemaLoading = true;
  updateSidebarState();
  renderChat();

  try {
    const recentMessages = cinemaMessages.slice(-6).map(m => ({
      role: m.role === 'user' ? 'user' : 'companion',
      text: m.text,
    }));

    const watchContext = frameSource ? {
      title: frameSource.title,
      currentTime: 0,
      duration: 0,
      sourceType: 'web-url',
      subtitleWindow: { previous: [], next: [] },
    } : {
      title: '',
      currentTime: 0,
      duration: 0,
      sourceType: 'web-url',
      subtitleWindow: { previous: [], next: [] },
    };

    const resp = await apiPost('/api/v1/chat', {
      session_key: 'kico_cinema',
      message: text,
      mode: 'cinema',
      recentMessages: recentMessages,
      watch: watchContext,
    });

    const replyText = resp.reply || resp.message || resp.text || '(空回复)';

    const assistantMsg = {
      id: genId(),
      role: 'companion',
      text: replyText,
      modelUsed: resp.model || resp.modelUsed || '',
      createdAt: new Date().toISOString(),
    };
    cinemaMessages.push(assistantMsg);
    saveChatHistory();
  } catch (err) {
    const errMsg = {
      id: genId(),
      role: 'companion',
      text: '[陪看错误] ' + (err.message || '请求失败'),
      createdAt: new Date().toISOString(),
    };
    cinemaMessages.push(errMsg);
    saveChatHistory();
  } finally {
    cinemaLoading = false;
    updateSidebarState();
    renderChat();
  }
}

// ── 工具函数 ──
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
</script>
