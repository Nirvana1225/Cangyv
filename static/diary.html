<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日记 - 苍聿居</title>
<link rel="manifest" href="/manifest.json">
<style id="global-css"></style>
<style>
/* ── 日记页面专属样式 ── */

/* 页面头部 */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 4px;
}
.page-header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
}
.page-header h1 span {
    color: var(--accent);
}
.lock-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .85rem;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--accentLight);
    cursor: pointer;
    transition: all .2s;
}
.lock-status:hover {
    background: var(--accent);
    color: #fff;
}
.lock-status.locked {
    color: var(--accent);
}

/* ── 时间线 ── */
.timeline {
    position: relative;
    padding-left: 36px;
}
.timeline::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--accent), var(--border));
    border-radius: 1px;
}

/* 日期分组标题 */
.date-group {
    position: relative;
    margin-bottom: 20px;
}
.date-group-title {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .85rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    padding: 4px 12px;
    background: var(--accentLight);
    border-radius: 20px;
}
.date-group-title::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent);
}

/* 日记卡片 */
.diary-card {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all .25s ease;
}
.diary-card::before {
    content: '';
    position: absolute;
    left: -26px;
    top: 22px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--bg);
    transition: background .2s;
}
.diary-card:hover {
    box-shadow: 0 4px 24px var(--shadow);
    transform: translateX(4px);
}
.diary-card:hover::before {
    background: var(--accent);
}

/* 卡片头部 */
.diary-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.diary-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .8rem;
    color: var(--muted);
}
.diary-mood {
    font-size: 1.2rem;
    line-height: 1;
}
.diary-privacy-icon {
    font-size: .85rem;
    opacity: .6;
    transition: opacity .2s;
}
.diary-privacy-icon:hover {
    opacity: 1;
}

/* 卡片内容 */
.diary-content-preview {
    font-size: .9rem;
    line-height: 1.6;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}
.diary-content-full {
    font-size: .9rem;
    line-height: 1.8;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
}

/* 卡片操作栏 */
.diary-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
}
.diary-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 16px;
    font-size: .78rem;
    color: var(--muted);
    transition: all .2s;
}
.diary-action-btn:hover {
    background: var(--accentLight);
    color: var(--accent);
}
.diary-action-btn.danger:hover {
    background: rgba(231,76,60,.1);
    color: #e74c3c;
}

/* 评论区 */
.comments-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.comments-title {
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
}
.comment-item {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    font-size: .85rem;
    line-height: 1.5;
}
.comment-item + .comment-item {
    border-top: 1px solid var(--border);
}
.comment-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accentLight);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    color: var(--accent);
    flex-shrink: 0;
}
.comment-body {
    flex: 1;
    min-width: 0;
}
.comment-text {
    color: var(--text);
    word-break: break-word;
}
.comment-time {
    font-size: .75rem;
    color: var(--muted);
    margin-top: 2px;
}
.comment-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}
.comment-input-row input {
    flex: 1;
    padding: 8px 12px;
    font-size: .85rem;
}

/* ── 浮动按钮 ── */
.fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    transition: all .25s;
    z-index: 500;
}
.fab:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.fab:active {
    transform: scale(.95);
}

/* ── 写日记模态框 ── */
.write-modal .modal {
    max-width: 560px;
}
.write-modal textarea {
    width: 100%;
    min-height: 160px;
    padding: 14px;
    font-size: .9rem;
    line-height: 1.7;
    border-radius: var(--radius);
    resize: vertical;
}

/* 心情选择器 */
.mood-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0;
}
.mood-option {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: .82rem;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all .2s;
    cursor: pointer;
}
.mood-option:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accentLight);
}
.mood-option.selected {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
}
.mood-option .mood-emoji {
    font-size: 1.1rem;
}

/* 私密开关 */
.privacy-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: .88rem;
    color: var(--muted);
}
.toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: var(--border);
    cursor: pointer;
    transition: background .2s;
}
.toggle-switch.active {
    background: var(--accent);
}
.toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.toggle-switch.active::after {
    transform: translateX(20px);
}

/* ── 密码模态框 ── */
.lock-modal input[type="password"] {
    width: 100%;
    margin: 12px 0;
    padding: 12px 14px;
    font-size: .9rem;
}

/* ── 确认删除模态框 ── */
.confirm-text {
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.6;
    margin-bottom: 8px;
}

/* ── 加载骨架 ── */
.skeleton-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 12px;
}
.skeleton-line {
    height: 14px;
    border-radius: 6px;
    margin-bottom: 10px;
}
.skeleton-line.short { width: 40%; }
.skeleton-line.medium { width: 70%; }
.skeleton-line.long { width: 95%; }

/* ── 展开动画 ── */
.diary-card.expanded {
    border-color: var(--accent);
    box-shadow: 0 4px 24px var(--shadow);
}
.diary-card.expanded::before {
    background: var(--accent);
}

/* ── 响应式 ── */
@media (max-width: 768px) {
    .timeline {
        padding-left: 28px;
    }
    .timeline::before {
        left: 10px;
    }
    .date-group-title::before {
        left: -22px;
    }
    .diary-card::before {
        left: -22px;
    }
    .fab {
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
    }
    .mood-option {
        padding: 5px 10px;
        font-size: .78rem;
    }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<div id="nav-container"></div>

<!-- 主内容 -->
<div class="container">
    <div class="page-header">
        <h1>📖 <span>日记</span></h1>
        <div id="lock-status" class="lock-status" onclick="handleLockToggle()">
            <span id="lock-icon">🔓</span>
            <span id="lock-text">未加密</span>
        </div>
    </div>

    <!-- 加载骨架 -->
    <div id="skeleton-container" class="timeline">
        <div class="skeleton-card">
            <div class="skeleton-line short skeleton"></div>
            <div class="skeleton-line long skeleton"></div>
            <div class="skeleton-line medium skeleton"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-line short skeleton"></div>
            <div class="skeleton-line long skeleton"></div>
            <div class="skeleton-line medium skeleton"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-line short skeleton"></div>
            <div class="skeleton-line long skeleton"></div>
        </div>
    </div>

    <!-- 日记时间线 -->
    <div id="diary-timeline" class="timeline" style="display:none"></div>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state" style="display:none">
        <div class="icon">📖</div>
        <h3>还没有日记</h3>
        <p>点击右下角按钮，写下你的第一篇日记吧</p>
    </div>
</div>

<!-- 浮动写日记按钮 -->
<button class="fab" onclick="openWriteModal()" title="写日记">✏️</button>

<!-- 写日记模态框 -->
<div id="write-modal" class="modal-overlay write-modal">
    <div class="modal">
        <h2>✏️ 写日记</h2>
        <textarea id="diary-content" placeholder="今天有什么想说的..." autofocus></textarea>
        <div class="mood-selector" id="mood-selector"></div>
        <div class="privacy-toggle">
            <div id="privacy-switch" class="toggle-switch" onclick="togglePrivacySwitch()"></div>
            <span>🔒 仅自己可见</span>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeWriteModal()">取消</button>
            <button class="btn btn-primary" onclick="submitDiary()">发布</button>
        </div>
    </div>
</div>

<!-- 密码模态框 -->
<div id="lock-modal" class="modal-overlay lock-modal">
    <div class="modal">
        <h2 id="lock-modal-title">🔐 加密日记</h2>
        <p id="lock-modal-desc" class="confirm-text">设置密码后，日记将对他人隐藏</p>
        <input type="password" id="lock-password" placeholder="请输入密码" autocomplete="new-password">
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeLockModal()">取消</button>
            <button class="btn btn-primary" id="lock-confirm-btn" onclick="submitLock()">确认</button>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div id="delete-modal" class="modal-overlay">
    <div class="modal">
        <h2>🗑️ 删除日记</h2>
        <p class="confirm-text">确定要删除这篇日记吗？此操作不可撤销。</p>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeDeleteModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
        </div>
    </div>
</div>

<!-- 日记详情模态框 -->
<div id="detail-modal" class="modal-overlay">
    <div class="modal" style="max-width:600px">
        <div id="detail-content"></div>
    </div>
</div>

<script src="/common.js"></script>
<script>
// ── 状态 ──
const MOODS = [
    { emoji: '😊', label: '开心' },
    { emoji: '😢', label: '难过' },
    { emoji: '😡', label: '生气' },
    { emoji: '😰', label: '焦虑' },
    { emoji: '😌', label: '平静' },
    { emoji: '🤔', label: '思考' },
    { emoji: '😴', label: '疲惫' },
    { emoji: '🥰', label: '幸福' },
];

let diaries = [];
let selectedMood = null;
let isPrivate = false;
let deleteTargetId = null;
let isLocked = false;
let expandedId = null;
let unlockedDiaryIds = new Set();
let lockTargetId = null;
let lockAction = null;

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', () => {
    // 注入全局CSS
    const globalStyle = document.getElementById('global-css');
    if (globalStyle && typeof GLOBAL_CSS !== 'undefined') {
        globalStyle.textContent = GLOBAL_CSS;
    }
    initTheme();
    $('#nav-container').innerHTML = renderNav('diary');
    renderMoodSelector();
    loadDiaries();
});

// ── 加载日记列表 ──
async function loadDiaries() {
    try {
        const data = await apiGet('/api/v1/diary?limit=100&offset=0');
        diaries = Array.isArray(data) ? data : (data.items || data.diaries || []);
        isLocked = diaries.length > 0 && diaries.some(d => d.is_locked);
        renderDiaries();
    } catch (e) {
        showToast('加载日记失败: ' + e.message, 'error');
        diaries = [];
        renderDiaries();
    }
}

// ── 渲染日记时间线 ──
function renderDiaries() {
    const timeline = $('#diary-timeline');
    const empty = $('#empty-state');
    const skeleton = $('#skeleton-container');

    skeleton.style.display = 'none';

    if (!diaries.length) {
        timeline.style.display = 'none';
        empty.style.display = '';
        return;
    }

    empty.style.display = 'none';
    timeline.style.display = '';

    // 按日期分组
    const groups = {};
    diaries.forEach(d => {
        const dateKey = formatDate(d.created_at);
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(d);
    });

    let html = '';
    for (const [date, items] of Object.entries(groups)) {
        html += `<div class="date-group">
            <div class="date-group-title">📅 ${escapeHtml(date)}</div>`;
        items.forEach(d => {
            html += renderDiaryCard(d);
        });
        html += '</div>';
    }

    timeline.innerHTML = html;
    updateLockStatus();
}

function renderDiaryCard(d) {
    const moodEmoji = d.mood || '';
    const privacyIcon = d.is_private ? '🔒' : '🌐';
    const timeStr = formatTime(d.created_at);
    const isExpanded = expandedId === d.id;

    const _lockChk = d.locked && !unlockedDiaryIds.has(d.id);
    let contentHtml;
    if (_lockChk) {
        contentHtml = '<div class="diary-locked-overlay" style="text-align:center;padding:20px 0;color:var(--muted);font-size:.9rem;">ð å·²å å¯ï¼éå¯ç æ¥ç</div>';
    } else if (isExpanded) {
        contentHtml = `<div class="diary-content-full">${escapeHtml(d.content)}</div>`;
    } else {
        contentHtml = `<div class="diary-content-preview">${escapeHtml(d.content)}</div>`;
    }

    let actionsHtml = '';
    if (isExpanded) {
        actionsHtml = `<div class="diary-actions">
            ${d.locked
                ? '<button class="diary-action-btn" onclick="event.stopPropagation(); handleDiaryLock('' + d.id + '', 'unlock')">🔓 解锁</button>'
                : '<button class="diary-action-btn" onclick="event.stopPropagation(); handleDiaryLock('' + d.id + '', 'lock')">🔒 加密</button>'
            }
            <button class="diary-action-btn" onclick="event.stopPropagation(); togglePrivacy(${d.id}, ${d.is_private})">
                ${d.is_private ? '🌐 公开' : '🔒 私密'}
            </button>
            <button class="diary-action-btn danger" onclick="event.stopPropagation(); openDeleteModal(${d.id})">
                🗑️ 删除
            </button>
        </div>`;
    }

    let commentsHtml = '';
    if (isExpanded && !_lockChk && d.comments && d.comments.length) {
        commentsHtml = `<div class="comments-section">
            <div class="comments-title">💬 评论 (${d.comments.length})</div>
            ${d.comments.map(c => `<div class="comment-item">
                <div class="comment-avatar">💬</div>
                <div class="comment-body">
                    <div class="comment-text">${escapeHtml(c.content || c.text || '')}</div>
                    <div class="comment-time">${formatTime(c.created_at)}</div>
                </div>
            </div>`).join('')}
        </div>`;
    }

    let commentInputHtml = '';
    if (isExpanded && !_lockChk) {
        commentInputHtml = `<div class="comment-input-row">
            <input type="text" id="comment-input-${d.id}" placeholder="写评论..." onkeydown="if(event.key==='Enter'){event.stopPropagation();addComment(${d.id})}">
            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();addComment(${d.id})">发送</button>
        </div>`;
    }

    const _lck = d.locked && !unlockedDiaryIds.has(d.id);
    return `<div class="diary-card ${isExpanded ? 'expanded' : ''}" onclick="${_lck ? '' : `toggleExpand(${d.id})`}">
        <div class="diary-card-header">
            <div class="diary-meta">
                ${moodEmoji ? `<span class="diary-mood">${moodEmoji}</span>` : ''}
                <span>${escapeHtml(timeStr)}</span>
                ${d.locked ? '<span style="margin-left:6px;font-size:.8rem;" title="已加密">🔒</span>' : ''}
            </div>
            <span class="diary-privacy-icon" title="${d.is_private ? '私密' : '公开'}">${privacyIcon}</span>
        </div>
        ${contentHtml}
        ${actionsHtml}
        ${commentsHtml}
        ${commentInputHtml}
    </div>`;
}

// ── 单篇日记苍聿锁 ──
function handleDiaryLock(id, action) {
    lockTargetId = id;
    lockAction = action;
    var isUnlock = action === 'unlock';
    document.getElementById('lock-modal-title').textContent = isUnlock ? '🔓 解锁日记' : '🔒 加密日记';
    document.getElementById('lock-modal-desc').textContent = isUnlock ? '输入密码以解锁这篇日记' : '设置密码，加密这篇日记';
    document.getElementById('lock-confirm-btn').textContent = isUnlock ? '解锁' : '加密';
    document.getElementById('lock-password').value = '';
    document.getElementById('lock-modal').classList.add('active');
    setTimeout(function(){document.getElementById('lock-password').focus();}, 200);
}
async function submitDiaryLock() {
    var pw = document.getElementById('lock-password').value.trim();
    try {
        if (lockAction === 'unlock') {
            await apiPost('/api/v1/diary/' + lockTargetId + '/unlock', { password: pw });
            unlockedDiaryIds.add(lockTargetId);
            showToast('解锁成功 🔓', 'success');
        } else {
            await apiPost('/api/v1/diary/' + lockTargetId + '/lock', { password: pw });
            showToast('已加密 🔒', 'success');
        }
        closeLockModal();
        lockTargetId = null;
        lockAction = null;
        await loadDiaries();
    } catch(e) { showToast('操作失败: ' + e.message, 'error'); }
}
// ── 展开/收起日记 ──
function toggleExpand(id) {
    if (expandedId === id) {
        expandedId = null;
    } else {
        expandedId = id;
    }
    renderDiaries();
}

// ── 心情选择器 ──
function renderMoodSelector() {
    const container = $('#mood-selector');
    container.innerHTML = MOODS.map(m =>
        `<button type="button" class="mood-option" data-mood="${m.emoji}" onclick="selectMood(this, '${m.emoji}')">
            <span class="mood-emoji">${m.emoji}</span>${m.label}
        </button>`
    ).join('');
}

function selectMood(el, emoji) {
    $$('.mood-option').forEach(b => b.classList.remove('selected'));
    if (selectedMood === emoji) {
        selectedMood = null;
    } else {
        el.classList.add('selected');
        selectedMood = emoji;
    }
}

// ── 私密开关 ──
function togglePrivacySwitch() {
    isPrivate = !isPrivate;
    const sw = $('#privacy-switch');
    sw.classList.toggle('active', isPrivate);
}

// ── 写日记模态框 ──
function openWriteModal() {
    $('#write-modal').classList.add('active');
    $('#diary-content').value = '';
    selectedMood = null;
    isPrivate = false;
    $$('.mood-option').forEach(b => b.classList.remove('selected'));
    $('#privacy-switch').classList.remove('active');
    setTimeout(() => $('#diary-content').focus(), 200);
}

function closeWriteModal() {
    $('#write-modal').classList.remove('active');
}

async function submitDiary() {
    const content = $('#diary-content').value.trim();
    if (!content) {
        showToast('请输入日记内容', 'error');
        return;
    }
    const body = { content };
    if (selectedMood) body.mood = selectedMood;
    if (isPrivate) body.is_private = true;

    try {
        await apiPost('/api/v1/diary', body);
        showToast('日记发布成功 🎉', 'success');
        closeWriteModal();
        await loadDiaries();
    } catch (e) {
        showToast('发布失败: ' + e.message, 'error');
    }
}

// ── 隐私切换 ──
async function togglePrivacy(id, currentPrivate) {
    try {
        await apiPost(`/api/v1/diary/${id}/toggle-privacy`, {});
        showToast(currentPrivate ? '已设为公开' : '已设为私密', 'success');
        await loadDiaries();
    } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
    }
}

// ── 删除日记 ──
function openDeleteModal(id) {
    deleteTargetId = id;
    $('#delete-modal').classList.add('active');
}

function closeDeleteModal() {
    $('#delete-modal').classList.remove('active');
    deleteTargetId = null;
}

async function confirmDelete() {
    if (!deleteTargetId) return;
    try {
        await apiDelete(`/api/v1/diary/${deleteTargetId}`);
        showToast('日记已删除', 'success');
        closeDeleteModal();
        if (expandedId === deleteTargetId) expandedId = null;
        await loadDiaries();
    } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
    }
}

// ── 评论 ──
async function addComment(diaryId) {
    const input = $(`#comment-input-${diaryId}`);
    if (!input) return;
    const text = input.value.trim();
    if (!text) {
        showToast('请输入评论内容', 'error');
        return;
    }
    try {
        await apiPost(`/api/v1/diary/${diaryId}/comments`, { content: text });
        showToast('评论成功', 'success');
        await loadDiaries();
    } catch (e) {
        showToast('评论失败: ' + e.message, 'error');
    }
}

// ── 加密/解锁 ──
function updateLockStatus() {
    const icon = $('#lock-icon');
    const text = $('#lock-text');
    const status = $('#lock-status');
    if (isLocked) {
        icon.textContent = '🔒';
        text.textContent = '已加密';
        status.classList.add('locked');
    } else {
        icon.textContent = '🔓';
        text.textContent = '未加密';
        status.classList.remove('locked');
    }
}

function handleLockToggle() {
    if (isLocked) {
        // 解锁
        $('#lock-modal-title').textContent = '🔓 解锁日记';
        $('#lock-modal-desc').textContent = '输入密码以解锁日记';
        $('#lock-confirm-btn').textContent = '解锁';
        $('#lock-password').value = '';
        $('#lock-modal').classList.add('active');
        setTimeout(() => $('#lock-password').focus(), 200);
    } else {
        // 加密
        $('#lock-modal-title').textContent = '🔐 加密日记';
        $('#lock-modal-desc').textContent = '设置密码后，日记将对他人隐藏';
        $('#lock-confirm-btn').textContent = '加密';
        $('#lock-password').value = '';
        $('#lock-modal').classList.add('active');
        setTimeout(() => $('#lock-password').focus(), 200);
    }
}

function closeLockModal() {
    $('#lock-modal').classList.remove('active');
}

async function submitLock() {
    if (lockTargetId) { await submitDiaryLock(); return; }

    if (lockTargetId) { await submitDiaryLock(); return; }

    const password = $('#lock-password').value.trim();
    if (!password) {
        showToast('请输入密码', 'error');
        return;
    }
    try {
        if (isLocked) {
            await apiPost('/api/v1/diary/unlock', { password });
            showToast('日记已解锁', 'success');
        } else {
            await apiPost('/api/v1/diary/lock', { password });
            showToast('日记已加密', 'success');
        }
        isLocked = !isLocked;
        updateLockStatus();
        closeLockModal();
        await loadDiaries();
    } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
    }
}



// ── 模态框点击遮罩关闭 ──
document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('active')) {
        e.target.classList.remove('active');
    }
});

// ── ESC 关闭模态框 ──
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        $$('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    }
});
</script>
</body>
</html>
