<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ桥接 - 苍聿居</title>
<style id="global-css"></style>
<style>
.qq-page { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* 顶部操作栏 */
.qq-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qq-toolbar select, .qq-toolbar input[type="text"] {
  padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--inputBg); color: var(--text); font-size: .875rem; outline: none;
  transition: border .2s;
}
.qq-toolbar select:focus, .qq-toolbar input[type="text"]:focus { border-color: var(--accent); }
.qq-toolbar select { min-width: 160px; }
.qq-toolbar .search-box { flex: 1; min-width: 180px; position: relative; }
.qq-toolbar .search-box input { width: 100%; padding-right: 36px; }
.qq-toolbar .search-box .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); opacity: .5; cursor: pointer; }

/* 统计区 */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat-card {
  background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 16px; text-align: center;
  transition: box-shadow .2s;
}
.stat-card:hover { box-shadow: 0 4px 20px var(--shadow); }
.stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
.stat-card .stat-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }

/* 聊天区域 */
.chat-container {
  background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border);
  border-radius: var(--radius-lg); display: flex; flex-direction: column;
  min-height: 420px; max-height: 65vh; overflow: hidden;
}
.chat-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: .95rem; display: flex; justify-content: space-between; align-items: center;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg-item { display: flex; gap: 10px; max-width: 80%; animation: fadeIn .3s ease; }
.msg-item.self { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accentLight);
  display: flex; align-items: center; justify-content: center; font-size: .8rem;
  color: var(--accent); font-weight: 600; flex-shrink: 0;
}
.msg-body {}
.msg-sender { font-size: .72rem; color: var(--muted); margin-bottom: 3px; }
.msg-item.self .msg-sender { text-align: right; }
.msg-bubble {
  padding: 9px 14px; border-radius: 14px; font-size: .875rem; line-height: 1.5;
  background: var(--inputBg); border: 1px solid var(--border); word-break: break-word;
}
.msg-item.self .msg-bubble { background: var(--accentLight); border-color: transparent; }
.msg-time { font-size: .68rem; color: var(--muted); margin-top: 3px; opacity: .7; }
.msg-item.self .msg-time { text-align: right; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* 同步表单 */
.sync-section {
  background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
}
.sync-section h3 { font-size: .95rem; margin-bottom: 12px; color: var(--accent); }
.sync-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sync-form .full-width { grid-column: 1 / -1; }
.sync-form textarea { min-height: 60px; resize: vertical; }
.sync-form input, .sync-form textarea, .sync-form select {
  padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--inputBg); color: var(--text); font-size: .875rem; outline: none;
  transition: border .2s;
}
.sync-form input:focus, .sync-form textarea:focus { border-color: var(--accent); }
.sync-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* 搜索结果高亮 */
.highlight { background: var(--accentLight); padding: 1px 3px; border-radius: 3px; }

/* 加载与空状态 */
.loading-indicator { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 10px; color: var(--muted); font-size: .875rem; }
.no-messages { text-align: center; padding: 60px 20px; color: var(--muted); }
.no-messages .icon { font-size: 2.5rem; margin-bottom: 8px; }

/* 分页 */
.pagination { display: flex; justify-content: center; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
.pagination button:disabled { opacity: .4; cursor: not-allowed; }

@media (max-width: 768px) {
  .qq-toolbar { flex-direction: column; }
  .qq-toolbar .search-box { min-width: 100%; }
  .sync-form { grid-template-columns: 1fr; }
  .msg-item { max-width: 90%; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div id="nav-container"></div>

<div class="qq-page">
  <!-- 工具栏 -->
  <div class="qq-toolbar">
    <select id="groupSelect"><option value="">选择群组...</option></select>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索消息..." />
      <span class="search-icon" onclick="doSearch()">🔍</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="loadGroups()">刷新群组</button>
  </div>

  <!-- 统计 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">总消息数</div></div>
    <div class="stat-card"><div class="stat-value" id="statToday">-</div><div class="stat-label">今日消息</div></div>
    <div class="stat-card"><div class="stat-value" id="statMembers">-</div><div class="stat-label">活跃成员</div></div>
    <div class="stat-card"><div class="stat-value" id="statLast">-</div><div class="stat-label">最后活跃</div></div>
  </div>

  <!-- 聊天区域 -->
  <div class="chat-container">
    <div class="chat-header">
      <span id="chatTitle">QQ聊天记录</span>
      <button class="btn btn-ghost btn-sm" onclick="loadHistory()">刷新</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="no-messages"><div class="icon">💬</div><div>请选择一个群组查看聊天记录</div></div>
    </div>
    <div class="pagination" id="pagination" style="display:none;">
      <button class="btn btn-ghost btn-sm" id="btnPrev" onclick="prevPage()">上一页</button>
      <span id="pageInfo" style="font-size:.8rem;color:var(--muted);display:flex;align-items:center;"></span>
      <button class="btn btn-ghost btn-sm" id="btnNext" onclick="nextPage()">下一页</button>
    </div>
  </div>

  <!-- 同步表单 -->
  <div class="sync-section">
    <h3>📤 手动同步消息</h3>
    <div class="sync-form">
      <select id="syncGroupId" class="full-width"><option value="">选择群组...</option></select>
      <input type="text" id="syncUserId" placeholder="发送者QQ号" />
      <input type="text" id="syncTimestamp" placeholder="时间戳 (可选，留空为当前)" />
      <textarea id="syncContent" class="full-width" placeholder="消息内容..."></textarea>
      <div class="sync-actions">
        <button class="btn btn-ghost btn-sm" onclick="clearSyncForm()">清空</button>
        <button class="btn btn-primary btn-sm" onclick="syncMessage()">同步</button>
      </div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
(function() {
  // ── 状态 ──
  let groups = [];
  let currentGroupId = '';
  let offset = 0;
  const limit = 30;
  let searchMode = false;
  let searchResults = [];

  // ── 初始化 ──
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('global-css').textContent = GLOBAL_CSS;
    document.getElementById('nav-container').innerHTML = renderNav('panel');
    loadGroups();

    // 回车搜索
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // 群组切换
    document.getElementById('groupSelect').addEventListener('change', e => {
      currentGroupId = e.target.value;
      offset = 0;
      searchMode = false;
      document.getElementById('searchInput').value = '';
      loadHistory();
      loadStats();
    });
  });

  // ── 加载群组 ──
  async function loadGroups() {
    try {
      const data = await apiGet('/api/v1/qq/groups');
      groups = data.groups || data || [];
      const sel = document.getElementById('groupSelect');
      const syncSel = document.getElementById('syncGroupId');
      const prevVal = sel.value;
      sel.innerHTML = '<option value="">选择群组...</option>';
      syncSel.innerHTML = '<option value="">选择群组...</option>';
      groups.forEach(g => {
        const id = g.group_id || g.id || g;
        const name = g.group_name || g.name || id;
        sel.innerHTML += `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`;
        syncSel.innerHTML += `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`;
      });
      if (prevVal) sel.value = prevVal;
    } catch (e) {
      console.error('加载群组失败:', e);
    }
  }
  window.loadGroups = loadGroups;

  // ── 加载聊天记录 ──
  async function loadHistory() {
    const container = document.getElementById('chatMessages');
    if (!currentGroupId) {
      container.innerHTML = '<div class="no-messages"><div class="icon">💬</div><div>请选择一个群组查看聊天记录</div></div>';
      document.getElementById('pagination').style.display = 'none';
      return;
    }
    container.innerHTML = '<div class="loading-indicator"><div class="spinner"></div>加载中...</div>';
    try {
      const data = await apiGet(`/api/v1/qq/history?group_id=${encodeURIComponent(currentGroupId)}&limit=${limit}&offset=${offset}`);
      const messages = data.messages || data || [];
      renderMessages(messages);
      updatePagination(data.total || messages.length);
    } catch (e) {
      container.innerHTML = `<div class="no-messages"><div class="icon">⚠️</div><div>加载失败: ${escapeHtml(e.message)}</div></div>`;
    }
  }
  window.loadHistory = loadHistory;

  // ── 渲染消息 ──
  function renderMessages(messages) {
    const container = document.getElementById('chatMessages');
    if (!messages.length) {
      container.innerHTML = '<div class="no-messages"><div class="icon">📭</div><div>暂无消息记录</div></div>';
      document.getElementById('pagination').style.display = 'none';
      return;
    }
    container.innerHTML = messages.map(m => {
      const isSelf = false; // QQ消息默认左对齐
      const sender = m.user_id || m.sender || '未知';
      const content = m.content || m.message || m.text || '';
      const time = m.timestamp || m.created_at || m.time || '';
      const avatarLetter = String(sender).charAt(0).toUpperCase();
      return `<div class="msg-item${isSelf ? ' self' : ''}">
        <div class="msg-avatar">${avatarLetter}</div>
        <div class="msg-body">
          <div class="msg-sender">${escapeHtml(sender)}</div>
          <div class="msg-bubble">${escapeHtml(content)}</div>
          <div class="msg-time">${time ? formatTime(time) : ''}</div>
        </div>
      </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
  }

  // ── 分页 ──
  function updatePagination(total) {
    const pag = document.getElementById('pagination');
    if (total <= limit) { pag.style.display = 'none'; return; }
    pag.style.display = 'flex';
    const page = Math.floor(offset / limit) + 1;
    const totalPages = Math.ceil(total / limit);
    document.getElementById('pageInfo').textContent = `${page} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = offset === 0;
    document.getElementById('btnNext').disabled = offset + limit >= total;
  }

  window.prevPage = function() { if (offset >= limit) { offset -= limit; loadHistory(); } };
  window.nextPage = function() { offset += limit; loadHistory(); };

  // ── 搜索 ──
  window.doSearch = async function() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { if (currentGroupId) loadHistory(); return; }
    const container = document.getElementById('chatMessages');
    container.innerHTML = '<div class="loading-indicator"><div class="spinner"></div>搜索中...</div>';
    try {
      let url = `/api/v1/qq/search?q=${encodeURIComponent(q)}`;
      if (currentGroupId) url += `&group_id=${encodeURIComponent(currentGroupId)}`;
      const data = await apiGet(url);
      const results = data.results || data.messages || data || [];
      searchMode = true;
      searchResults = results;
      renderMessages(results);
      document.getElementById('chatTitle').textContent = `搜索: ${q} (${results.length}条)`;
      document.getElementById('pagination').style.display = 'none';
    } catch (e) {
      container.innerHTML = `<div class="no-messages"><div class="icon">⚠️</div><div>搜索失败: ${escapeHtml(e.message)}</div></div>`;
    }
  };

  // ── 统计 ──
  async function loadStats() {
    if (!currentGroupId) return;
    try {
      const data = await apiGet(`/api/v1/qq/stats?group_id=${encodeURIComponent(currentGroupId)}`);
      document.getElementById('statTotal').textContent = data.total_messages ?? data.total ?? '-';
      document.getElementById('statToday').textContent = data.today_messages ?? data.today ?? '-';
      document.getElementById('statMembers').textContent = data.active_members ?? data.members ?? '-';
      document.getElementById('statLast').textContent = data.last_active ? formatTime(data.last_active) : '-';
    } catch (e) {
      console.error('加载统计失败:', e);
    }
  }

  // ── 同步消息 ──
  window.syncMessage = async function() {
    const group_id = document.getElementById('syncGroupId').value;
    const user_id = document.getElementById('syncUserId').value.trim();
    const content = document.getElementById('syncContent').value.trim();
    const timestamp = document.getElementById('syncTimestamp').value.trim();
    if (!group_id) { showToast('请选择群组', 'error'); return; }
    if (!user_id) { showToast('请输入发送者QQ号', 'error'); return; }
    if (!content) { showToast('请输入消息内容', 'error'); return; }
    try {
      const body = { group_id, user_id, content };
      if (timestamp) body.timestamp = timestamp;
      await apiPost('/api/v1/qq/sync', body);
      showToast('同步成功', 'success');
      clearSyncForm();
      if (currentGroupId === group_id) loadHistory();
    } catch (e) {
      showToast('同步失败: ' + e.message, 'error');
    }
  };

  window.clearSyncForm = function() {
    document.getElementById('syncUserId').value = '';
    document.getElementById('syncContent').value = '';
    document.getElementById('syncTimestamp').value = '';
  };
})();
</script>
</body>
</html>
